<svg class="arq-svg" viewBox="0 0 760 340" role="img" aria-labelledby="arq-c202h-t arq-c202h-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c202h-t">State hoisting en el contador: el estado baja y los eventos suben</title>
  <desc id="arq-c202h-d">Arriba, ContadorScreen guarda el estado cuenta, igual a 3, con remember. Se lo pasa como parámetro a ContadorContent, abajo, que pinta el 3 y los botones menos uno, más uno y Reset. Cada botón avisa hacia arriba con una lambda: onDecrementar, onIncrementar y onReset. ContadorContent no guarda nada.</desc>
  <defs>
    <marker id="arq-c202h-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c202h-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="180" y="20" width="400" height="72" rx="10" class="arq-ui"/>
  <text x="380" y="42" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">ContadorScreen  (con estado)</text>
  <rect x="200" y="56" width="110" height="24" rx="12" class="arq-dom"/>
  <text x="255" y="73" class="arq-t arq-code arq-xs" text-anchor="middle">cuenta = 3</text>
  <text x="322" y="73" class="arq-t arq-code arq-xs arq-muted">remember { mutableIntStateOf(0) }</text>
  <rect x="180" y="170" width="400" height="130" rx="14" class="arq-box" style="stroke-width:2"/>
  <text x="196" y="190" class="arq-t arq-code arq-xs arq-muted">ContadorContent  (sin estado)</text>
  <text x="380" y="238" class="arq-t arq-strong" style="font-size:34px" text-anchor="middle">3</text>
  <rect x="215" y="258" width="70" height="28" rx="14" class="arq-box"/>
  <text x="250" y="277" class="arq-t arq-xs arq-strong" text-anchor="middle">-1</text>
  <rect x="345" y="258" width="70" height="28" rx="14" class="arq-ui"/>
  <text x="380" y="277" class="arq-t arq-xs arq-strong" text-anchor="middle">+1</text>
  <rect x="475" y="258" width="70" height="28" rx="14" class="arq-box"/>
  <text x="510" y="277" class="arq-t arq-xs arq-strong" text-anchor="middle">Reset</text>
  <line x1="380" y1="92" x2="380" y2="166" class="arq-dep" marker-end="url(#arq-c202h-a)"/>
  <text x="390" y="134" class="arq-t arq-code arq-xs arq-strong">cuenta</text>
  <path d="M215,272 C140,272 150,120 222,94" class="arq-flow" marker-end="url(#arq-c202h-f)"/>
  <text x="142" y="190" class="arq-t arq-code arq-xs" text-anchor="end">onDecrementar()</text>
  <path d="M415,268 C450,250 456,140 446,96" class="arq-flow" marker-end="url(#arq-c202h-f)"/>
  <text x="458" y="140" class="arq-t arq-code arq-xs">onIncrementar()</text>
  <path d="M545,272 C625,272 620,120 545,94" class="arq-flow" marker-end="url(#arq-c202h-f)"/>
  <text x="630" y="200" class="arq-t arq-code arq-xs">onReset()</text>
  <line x1="180" y1="324" x2="220" y2="324" class="arq-dep" marker-end="url(#arq-c202h-a)"/>
  <text x="228" y="328" class="arq-t arq-xs">el estado baja como parámetro</text>
  <line x1="420" y1="324" x2="460" y2="324" class="arq-flow" marker-end="url(#arq-c202h-f)"/>
  <text x="468" y="328" class="arq-t arq-xs">los eventos suben como lambdas</text>
</svg>
