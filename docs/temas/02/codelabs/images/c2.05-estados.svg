<svg class="arq-svg" viewBox="0 0 760 300" role="img" aria-labelledby="arq-c205-t arq-c205-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c205-t">La máquina de estados del semáforo</title>
  <desc id="arq-c205-d">El ciclo normal: con Avanzar, ROJO pasa a VERDE, VERDE a AMBAR y AMBAR a ROJO. Desde cualquiera de las tres fases, Modo noche lleva a PRECAUCION, con el ámbar encendido. Desde PRECAUCION, Avanzar o Modo día vuelven a ROJO. Reset vuelve a ROJO desde cualquier fase.</desc>
  <defs>
    <marker id="arq-c205-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
  </defs>
  <rect x="30" y="20" width="410" height="250" rx="16" class="arq-box arq-dashed"/>
  <text x="44" y="40" class="arq-t arq-xs arq-muted">ciclo normal · Avanzar</text>
  <!-- ROJO -->
  <rect x="170" y="44" width="130" height="46" rx="10" class="arq-box" style="stroke-width:2"/>
  <circle cx="193" cy="67" r="11" style="fill:#e53935"/>
  <text x="212" y="72" class="arq-t arq-code arq-strong">ROJO</text>
  <!-- VERDE -->
  <rect x="290" y="200" width="130" height="46" rx="10" class="arq-box" style="stroke-width:2"/>
  <circle cx="313" cy="223" r="11" style="fill:#43a047"/>
  <text x="332" y="228" class="arq-t arq-code arq-strong">VERDE</text>
  <!-- AMBAR -->
  <rect x="50" y="200" width="130" height="46" rx="10" class="arq-box" style="stroke-width:2"/>
  <circle cx="73" cy="223" r="11" style="fill:#ffb300"/>
  <text x="92" y="228" class="arq-t arq-code arq-strong">AMBAR</text>
  <path d="M280,90 L340,196" class="arq-dep" marker-end="url(#arq-c205-a)"/>
  <text x="322" y="138" class="arq-t arq-xs">Avanzar</text>
  <path d="M290,223 L184,223" class="arq-dep" marker-end="url(#arq-c205-a)"/>
  <text x="237" y="214" class="arq-t arq-xs" text-anchor="middle">Avanzar</text>
  <path d="M120,200 L184,94" class="arq-dep" marker-end="url(#arq-c205-a)"/>
  <text x="140" y="138" class="arq-t arq-xs" text-anchor="end">Avanzar</text>
  <!-- PRECAUCION -->
  <rect x="560" y="120" width="170" height="52" rx="10" class="arq-dom" style="stroke-width:2"/>
  <circle cx="584" cy="146" r="11" style="fill:#ffb300"/>
  <text x="604" y="143" class="arq-t arq-code arq-strong">PRECAUCION</text>
  <text x="604" y="160" class="arq-t arq-xs arq-muted">modo noche</text>
  <line x1="440" y1="146" x2="556" y2="146" class="arq-dep" marker-end="url(#arq-c205-a)"/>
  <text x="498" y="138" class="arq-t arq-xs arq-strong" text-anchor="middle">Modo noche</text>
  <text x="498" y="162" class="arq-t arq-xs arq-muted" text-anchor="middle">desde cualquier fase</text>
  <path d="M645,118 C645,40 420,24 304,60" class="arq-dep" marker-end="url(#arq-c205-a)"/>
  <text x="655" y="82" class="arq-t arq-xs arq-strong">Avanzar o</text>
  <text x="655" y="96" class="arq-t arq-xs arq-strong">Modo día</text>
  <text x="645" y="232" class="arq-t arq-xs arq-muted" text-anchor="middle">Reset: a ROJO desde cualquier fase</text>
</svg>
