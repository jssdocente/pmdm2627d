<svg class="arq-svg" viewBox="0 0 760 240" role="img" aria-labelledby="arq-c202r-t arq-c202r-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c202r-t">Un clic, un cambio de estado y una recomposición</title>
  <desc id="arq-c202r-d">Tres momentos. Primero, con cuenta igual a 0, la pantalla muestra 0. Después, el clic en más uno ejecuta cuenta más más y el estado pasa a 1, pero la pantalla aún muestra 0. Por último, Compose recompone: vuelve a ejecutar el composable, que ahora lee 1 y lo pinta.</desc>
  <defs>
    <marker id="arq-c202r-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c202r-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <!-- 1 -->
  <text x="120" y="26" class="arq-t arq-xs arq-strong" text-anchor="middle">1 · Primera composición</text>
  <rect x="30" y="38" width="180" height="156" rx="14" class="arq-box" style="stroke-width:2"/>
  <rect x="60" y="50" width="120" height="24" rx="12" class="arq-dom"/>
  <text x="120" y="67" class="arq-t arq-code arq-xs" text-anchor="middle">cuenta = 0</text>
  <text x="120" y="132" class="arq-t arq-strong" style="font-size:40px" text-anchor="middle">0</text>
  <rect x="90" y="152" width="60" height="28" rx="14" class="arq-ui"/>
  <text x="120" y="171" class="arq-t arq-xs arq-strong" text-anchor="middle">+1</text>
  <!-- flecha 1 -> 2 -->
  <line x1="214" y1="116" x2="286" y2="116" class="arq-flow" marker-end="url(#arq-c202r-f)"/>
  <text x="250" y="100" class="arq-t arq-xs arq-strong" text-anchor="middle">clic +1</text>
  <text x="250" y="136" class="arq-t arq-code arq-xs" text-anchor="middle">cuenta++</text>
  <!-- 2 -->
  <text x="380" y="26" class="arq-t arq-xs arq-strong" text-anchor="middle">2 · El estado cambia</text>
  <rect x="290" y="38" width="180" height="156" rx="14" class="arq-box" style="stroke-width:2"/>
  <rect x="320" y="50" width="120" height="24" rx="12" class="arq-dom" style="stroke-width:2.4"/>
  <text x="380" y="67" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">cuenta = 1</text>
  <text x="380" y="132" class="arq-t arq-muted" style="font-size:40px" text-anchor="middle">0</text>
  <text x="380" y="160" class="arq-t arq-xs arq-muted" text-anchor="middle">la pantalla aún no lo sabe;</text>
  <text x="380" y="176" class="arq-t arq-xs arq-muted" text-anchor="middle">Compose sí: el estado avisa</text>
  <!-- flecha 2 -> 3 -->
  <line x1="474" y1="116" x2="546" y2="116" class="arq-dep" marker-end="url(#arq-c202r-a)"/>
  <text x="510" y="100" class="arq-t arq-xs arq-strong" text-anchor="middle">recompone</text>
  <!-- 3 -->
  <text x="640" y="26" class="arq-t arq-xs arq-strong" text-anchor="middle">3 · Se vuelve a ejecutar</text>
  <rect x="550" y="38" width="180" height="156" rx="14" class="arq-box" style="stroke-width:2"/>
  <rect x="580" y="50" width="120" height="24" rx="12" class="arq-dom"/>
  <text x="640" y="67" class="arq-t arq-code arq-xs" text-anchor="middle">cuenta = 1</text>
  <text x="640" y="132" class="arq-t arq-strong" style="font-size:40px" text-anchor="middle">1</text>
  <rect x="610" y="152" width="60" height="28" rx="14" class="arq-ui"/>
  <text x="640" y="171" class="arq-t arq-xs arq-strong" text-anchor="middle">+1</text>
  <text x="380" y="226" class="arq-t arq-s" text-anchor="middle">UI = f(estado): no se cambia el texto a mano; se vuelve a pintar a partir del estado.</text>
</svg>
