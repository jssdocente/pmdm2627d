<svg class="arq-svg" viewBox="0 0 760 320" role="img" aria-labelledby="arq-c203c-t arq-c203c-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c203c-t">El ciclo de vida de una Activity</title>
  <desc id="arq-c203c-d">Arriba, de izquierda a derecha: onCreate, onStart y onResume, cuando la app arranca y llega al primer plano. Abajo, de derecha a izquierda: onPause, onStop y onDestroy. Desde onPause se puede volver a onResume si el usuario regresa, y desde onStop a onStart si la app vuelve a verse. Al pulsar Home la Activity llega a onStop y se queda parada; al girar la pantalla llega hasta onDestroy y se crea otra desde onCreate.</desc>
  <defs>
    <marker id="arq-c203c-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c203c-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="120" y="26" class="arq-t arq-xs arq-muted" text-anchor="middle">la app arranca</text>
  <!-- Fila de arriba -->
  <rect x="40" y="36" width="160" height="40" rx="8" class="arq-ui"/>
  <text x="120" y="61" class="arq-t arq-code arq-strong" text-anchor="middle">onCreate()</text>
  <rect x="250" y="36" width="160" height="40" rx="8" class="arq-ui"/>
  <text x="330" y="61" class="arq-t arq-code arq-strong" text-anchor="middle">onStart()</text>
  <rect x="460" y="36" width="160" height="40" rx="8" class="arq-ui"/>
  <text x="540" y="61" class="arq-t arq-code arq-strong" text-anchor="middle">onResume()</text>
  <line x1="200" y1="56" x2="246" y2="56" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <line x1="410" y1="56" x2="456" y2="56" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <rect x="640" y="36" width="104" height="40" rx="20" class="arq-data"/>
  <text x="692" y="53" class="arq-t arq-xs arq-strong" text-anchor="middle">en primer</text>
  <text x="692" y="67" class="arq-t arq-xs arq-strong" text-anchor="middle">plano</text>
  <line x1="620" y1="56" x2="636" y2="56" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <!-- Fila de abajo -->
  <rect x="40" y="196" width="160" height="40" rx="8" class="arq-warn"/>
  <text x="120" y="221" class="arq-t arq-code arq-strong" text-anchor="middle">onDestroy()</text>
  <rect x="250" y="196" width="160" height="40" rx="8" class="arq-dom"/>
  <text x="330" y="221" class="arq-t arq-code arq-strong" text-anchor="middle">onStop()</text>
  <rect x="460" y="196" width="160" height="40" rx="8" class="arq-dom"/>
  <text x="540" y="221" class="arq-t arq-code arq-strong" text-anchor="middle">onPause()</text>
  <line x1="460" y1="216" x2="414" y2="216" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <line x1="250" y1="216" x2="204" y2="216" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <text x="120" y="252" class="arq-t arq-xs arq-muted" text-anchor="middle">la Activity desaparece</text>
  <!-- Verticales -->
  <line x1="525" y1="76" x2="525" y2="192" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <text x="515" y="130" class="arq-t arq-xs" text-anchor="end">pierde el</text>
  <text x="515" y="144" class="arq-t arq-xs" text-anchor="end">primer plano</text>
  <line x1="555" y1="196" x2="555" y2="80" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <text x="565" y="130" class="arq-t arq-xs">el usuario</text>
  <text x="565" y="144" class="arq-t arq-xs">regresa</text>
  <line x1="330" y1="196" x2="330" y2="80" class="arq-dep" marker-end="url(#arq-c203c-a)"/>
  <text x="340" y="130" class="arq-t arq-xs">vuelve a</text>
  <text x="340" y="144" class="arq-t arq-xs">verse</text>
  <!-- Eventos -->
  <rect x="40" y="272" width="330" height="36" rx="8" class="arq-ui"/>
  <text x="54" y="294" class="arq-t arq-xs"><tspan class="arq-strong">Home:</tspan> onPause → onStop. Se para, no se destruye.</text>
  <rect x="390" y="272" width="354" height="36" rx="8" class="arq-warn"/>
  <text x="404" y="294" class="arq-t arq-xs"><tspan class="arq-strong">Girar:</tspan> … onDestroy → onCreate. Se crea otra Activity.</text>
</svg>
