  <title id="arq-c206r-t">Lo que cambia en el laboratorio</title>
  <desc id="arq-c206r-d">Tres pantallas del móvil. En el lanzador, el laboratorio tiene un icono propio: un matraz blanco sobre fondo morado, recortado con la forma que elige el móvil. Al abrirlo, la pantalla de inicio muestra ese matraz en el centro sobre un fondo morado. Cuando Compose pinta el primer fotograma, aparece el menú del laboratorio de siempre.</desc>
