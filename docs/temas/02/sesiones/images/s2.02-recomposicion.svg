  <rect x="636" y="250" width="108" height="34" rx="8" class="arq-gray arq-dashed"/>
  <text x="690.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FilaPartidas</text>
  <line x1="570" y1="204" x2="690" y2="248" class="arq-guide"/>
  <text x="290" y="306" class="arq-t arq-xs arq-strong" text-anchor="middle">👆 «+1»: partidas 3 → 4</text>
  <rect x="20" y="330" width="24" height="16" rx="4" class="arq-dom"/>
  <text x="52" y="343" class="arq-t arq-xs">se vuelve a ejecutar (aparece en Logcat)</text>
  <rect x="330" y="330" width="24" height="16" rx="4" class="arq-gray arq-dashed"/>
  <text x="362" y="343" class="arq-t arq-xs">Compose se la salta: sus datos no han cambiado</text>
  <text x="380" y="372" class="arq-t arq-s arq-strong" text-anchor="middle">Solo se recompone quien lee el valor que ha cambiado.</text>
</svg>
