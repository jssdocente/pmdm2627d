  <text x="74.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Portada</text>
  <line x1="190" y1="204" x2="74" y2="248" class="arq-guide"/>
  <rect x="138" y="250" width="108" height="34" rx="8" class="arq-gray arq-dashed"/>
  <text x="192.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FilaValoracion</text>
  <line x1="190" y1="204" x2="192" y2="248" class="arq-guide"/>
  <rect x="256" y="250" width="108" height="34" rx="8" class="arq-dom"/>
  <text x="310.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FilaPartidas</text>
  <line x1="190" y1="204" x2="310" y2="248" class="arq-guide"/>
  <rect x="460" y="96" width="220" height="36" rx="8" class="arq-gray arq-dashed"/>
  <text x="570.0" y="110.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FichaJuegoScreen</text>
  <text x="570.0" y="126.0" class="arq-t arq-xs" text-anchor="middle">Stardew Valley</text>
  <rect x="480" y="170" width="180" height="34" rx="8" class="arq-gray arq-dashed"/>
  <text x="570.0" y="191.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FichaJuego</text>
  <line x1="380" y1="52" x2="570" y2="94" class="arq-guide"/>
  <line x1="570" y1="132" x2="570" y2="168" class="arq-guide"/>
  <rect x="400" y="250" width="108" height="34" rx="8" class="arq-gray arq-dashed"/>
  <text x="454.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Portada</text>
  <line x1="570" y1="204" x2="454" y2="248" class="arq-guide"/>
  <rect x="518" y="250" width="108" height="34" rx="8" class="arq-gray arq-dashed"/>
  <text x="572.0" y="271.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FilaValoracion</text>
