<svg class="arq-svg" viewBox="0 0 760 380" role="img" aria-labelledby="arq-s26-t arq-s26-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-s26-t">Qué se recompone al pulsar +1 en Hollow Knight</title>
  <desc id="arq-s26-d">Árbol de la biblioteca después de pulsar más uno en Hollow Knight. Se recomponen, resaltados, BibliotecaScreen porque lee partidasHollow, el texto del total, FichaJuegoScreen y FichaJuego de Hollow Knight y su FilaPartidas. Se saltan, en gris, la portada y la fila de valoración de Hollow Knight, cuyos datos no han cambiado, y toda la ficha de Stardew Valley.</desc>
  <defs>
    <marker id="arq-s26-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-s26-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="250" y="16" width="260" height="36" rx="8" class="arq-dom"/>
  <text x="380.0" y="30.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">BibliotecaScreen</text>
  <text x="380.0" y="46.0" class="arq-t arq-xs" text-anchor="middle">lee partidasHollow</text>
  <rect x="560" y="16" width="180" height="36" rx="8" class="arq-dom"/>
  <text x="650.0" y="30.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Text (total)</text>
  <text x="650.0" y="46.0" class="arq-t arq-xs" text-anchor="middle">3 → 4</text>
  <line x1="510" y1="34" x2="558" y2="34" class="arq-guide"/>
  <rect x="80" y="96" width="220" height="36" rx="8" class="arq-dom"/>
  <text x="190.0" y="110.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FichaJuegoScreen</text>
  <text x="190.0" y="126.0" class="arq-t arq-xs" text-anchor="middle">Hollow Knight</text>
  <rect x="100" y="170" width="180" height="34" rx="8" class="arq-dom"/>
  <text x="190.0" y="191.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FichaJuego</text>
  <line x1="380" y1="52" x2="190" y2="94" class="arq-guide"/>
  <line x1="190" y1="132" x2="190" y2="168" class="arq-guide"/>
