<svg class="arq-svg" viewBox="0 0 760 400" role="img" aria-labelledby="arq-s24-t arq-s24-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-s24-t">State hoisting: el estado baja y los eventos suben</title>
  <desc id="arq-s24-d">Arriba, FichaJuegoScreen guarda el estado: esFavorito y partidas, con rememberSaveable. Le pasa a FichaJuego los valores, hacia abajo, y FichaJuego le avisa de los eventos onFavoritoClick y onSumarPartida, hacia arriba. FichaJuego no guarda nada: por eso se puede usar en una preview con partidas igual a 12 y favorito marcado, sin pulsar ningún botón.</desc>
  <defs>
    <marker id="arq-s24-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-s24-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="40" y="20" width="380" height="76" rx="10" class="arq-ui"/>
  <text x="230" y="42" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FichaJuegoScreen  (con estado · rememberSaveable)</text>
  <rect x="70" y="58" width="150" height="22" rx="11" class="arq-dom"/>
  <text x="145.0" y="73" class="arq-t arq-code arq-xs" text-anchor="middle">esFavorito = false</text>
  <rect x="240" y="58" width="150" height="22" rx="11" class="arq-dom"/>
  <text x="315.0" y="73" class="arq-t arq-code arq-xs" text-anchor="middle">partidas = 2</text>
  <rect x="70" y="170" width="320" height="190" rx="14" class="arq-box" style="stroke-width:2"/>
  <text x="86" y="192" class="arq-t arq-code arq-xs arq-muted">FichaJuego  (sin estado)</text>
  <rect x="86" y="202" width="60" height="60" rx="8" class="arq-gray"/>
  <text x="116" y="238" class="arq-t arq-s arq-strong" text-anchor="middle">HK</text>
  <text x="160" y="224" class="arq-t arq-s arq-strong">Hollow Knight</text>
  <text x="160" y="242" class="arq-t arq-xs arq-muted">Metroidvania · 2017</text>
  <text x="86" y="288" class="arq-t arq-xs">★★★★☆</text>
  <rect x="250" y="274" width="124" height="24" rx="12" class="arq-dom"/>
  <text x="312" y="291" class="arq-t arq-xs arq-strong" text-anchor="middle">♡ Favorito</text>
  <text x="86" y="336" class="arq-t arq-xs">Partidas jugadas: 2</text>
  <rect x="320" y="320" width="54" height="26" rx="13" class="arq-ui"/>
  <text x="347" y="338" class="arq-t arq-xs arq-strong" text-anchor="middle">+1</text>
  <line x1="140" y1="96" x2="140" y2="166" class="arq-dep" marker-end="url(#arq-s24-a)"/>
  <text x="132" y="128" class="arq-t arq-code arq-xs" text-anchor="end">esFavorito</text>
  <text x="132" y="144" class="arq-t arq-code arq-xs" text-anchor="end">partidas</text>
  <path d="M312,272 C312,230 300,140 290,98" class="arq-flow" marker-end="url(#arq-s24-f)"/>
  <path d="M347,318 C420,300 410,140 380,98" class="arq-flow" marker-end="url(#arq-s24-f)"/>
  <text x="244" y="266" class="arq-t arq-code arq-xs arq-strong" text-anchor="end">onFavoritoClick</text>
  <text x="300" y="314" class="arq-t arq-code arq-xs arq-strong" text-anchor="end">onSumarPartida</text>
  <line x1="470" y1="20" x2="470" y2="370" class="arq-guide"/>
  <text x="610" y="40" class="arq-t arq-xs arq-strong" text-anchor="middle">@Preview: sin estado, sin pulsar</text>
  <rect x="500" y="60" width="240" height="170" rx="14" class="arq-box" style="stroke-width:2"/>
  <rect x="514" y="78" width="50" height="50" rx="8" class="arq-gray"/>
  <text x="539" y="108" class="arq-t arq-xs arq-strong" text-anchor="middle">HK</text>
  <text x="574" y="98" class="arq-t arq-xs arq-strong">Hollow Knight</text>
  <text x="574" y="114" class="arq-t arq-xs arq-muted">Metroidvania · 2017</text>
  <rect x="620" y="146" width="108" height="22" rx="11" class="arq-dom"/>
  <text x="674" y="161" class="arq-t arq-xs arq-strong" text-anchor="middle">♥ Favorito</text>
  <text x="514" y="204" class="arq-t arq-xs">Partidas jugadas: 12</text>
  <text x="500" y="256" class="arq-t arq-code arq-xs">FichaJuego(</text>
  <text x="514" y="272" class="arq-t arq-code arq-xs">esFavorito = true,</text>
  <text x="514" y="288" class="arq-t arq-code arq-xs">partidas = 12,</text>
  <text x="514" y="304" class="arq-t arq-code arq-xs">onFavoritoClick = {},</text>
  <text x="514" y="320" class="arq-t arq-code arq-xs">onSumarPartida = {}</text>
  <text x="500" y="336" class="arq-t arq-code arq-xs">)</text>
  <line x1="40" y1="384" x2="80" y2="384" class="arq-dep" marker-end="url(#arq-s24-a)"/>
  <text x="88" y="388" class="arq-t arq-xs">el valor baja</text>
  <line x1="200" y1="384" x2="240" y2="384" class="arq-flow" marker-end="url(#arq-s24-f)"/>
  <text x="248" y="388" class="arq-t arq-xs">el evento sube (lambda)</text>
</svg>
