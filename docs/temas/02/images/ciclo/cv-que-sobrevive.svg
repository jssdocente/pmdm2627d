<svg class="arq-svg" viewBox="0 0 760 330" role="img" aria-labelledby="arq-cvs-t arq-cvs-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-cvs-t">Qué estado sobrevive a cada cambio</title>
  <desc id="arq-cvs-d">Tres situaciones de menos a más grave. Recomposición: la Activity sigue igual y Compose repite solo las funciones que leen el estado; remember, rememberSaveable y el ViewModel se conservan. Girar la pantalla: Android destruye la Activity y crea otra; remember vuelve al valor inicial, rememberSaveable se restaura del Bundle y el ViewModel se conserva. Proceso eliminado en segundo plano: remember se pierde, rememberSaveable se restaura del Bundle y el ViewModel se crea de nuevo.</desc>
  <defs>
    <marker id="arq-cvs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-cvs-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="210" y="20" width="172" height="96" rx="10" class="arq-box"/>
  <text x="296" y="42" class="arq-t arq-s arq-strong" text-anchor="middle">Recomposición</text>
  <text x="296" y="64" class="arq-t arq-xs" text-anchor="middle">La Activity sigue igual.</text>
  <text x="296" y="80" class="arq-t arq-xs" text-anchor="middle">Compose repite solo las</text>
  <text x="296" y="96" class="arq-t arq-xs" text-anchor="middle">funciones que leen el estado.</text>
  <rect x="390" y="20" width="172" height="96" rx="10" class="arq-box"/>
  <text x="476" y="42" class="arq-t arq-s arq-strong" text-anchor="middle">Girar la pantalla</text>
  <text x="476" y="64" class="arq-t arq-xs" text-anchor="middle">Android destruye la Activity</text>
  <text x="476" y="80" class="arq-t arq-xs" text-anchor="middle">y crea otra: la composición</text>
  <text x="476" y="96" class="arq-t arq-xs" text-anchor="middle">empieza de cero.</text>
  <rect x="570" y="20" width="172" height="96" rx="10" class="arq-box"/>
  <text x="656" y="42" class="arq-t arq-s arq-strong" text-anchor="middle">Proceso eliminado</text>
  <text x="656" y="64" class="arq-t arq-xs" text-anchor="middle">Con la app en segundo plano,</text>
  <text x="656" y="80" class="arq-t arq-xs" text-anchor="middle">el sistema cierra el proceso;</text>
  <text x="656" y="96" class="arq-t arq-xs" text-anchor="middle">al volver, todo es nuevo.</text>
  <line x1="214" y1="124" x2="738" y2="124" class="arq-dep" marker-end="url(#arq-cvs-a)" style="stroke-width:1.4"/>
  <text x="738" y="140" class="arq-t arq-xs arq-muted" text-anchor="end">más grave</text>
  <text x="20" y="180" class="arq-t arq-code arq-xs arq-strong">remember { }</text>
  <rect x="210" y="156" width="172" height="40" rx="8" class="arq-data"/>
  <text x="296" y="181" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se conserva</text>
  <rect x="390" y="156" width="172" height="40" rx="8" class="arq-warn"/>
  <text x="476" y="181" class="arq-t arq-xs arq-strong" text-anchor="middle">✗ vuelve a empezar</text>
  <rect x="570" y="156" width="172" height="40" rx="8" class="arq-warn"/>
  <text x="656" y="181" class="arq-t arq-xs arq-strong" text-anchor="middle">✗ vuelve a empezar</text>
  <text x="20" y="230" class="arq-t arq-code arq-xs arq-strong">rememberSaveable { }</text>
  <rect x="210" y="206" width="172" height="40" rx="8" class="arq-data"/>
  <text x="296" y="231" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se conserva</text>
  <rect x="390" y="206" width="172" height="40" rx="8" class="arq-data"/>
  <text x="476" y="231" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se restaura del Bundle</text>
  <rect x="570" y="206" width="172" height="40" rx="8" class="arq-data"/>
  <text x="656" y="231" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se restaura del Bundle</text>
  <text x="20" y="274" class="arq-t arq-code arq-xs arq-strong">ViewModel</text>
  <text x="20" y="290" class="arq-t arq-xs arq-muted">(se verá en la UT3)</text>
  <rect x="210" y="256" width="172" height="40" rx="8" class="arq-data"/>
  <text x="296" y="281" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se conserva</text>
  <rect x="390" y="256" width="172" height="40" rx="8" class="arq-data"/>
  <text x="476" y="281" class="arq-t arq-xs arq-strong" text-anchor="middle">✓ se conserva</text>
  <rect x="570" y="256" width="172" height="40" rx="8" class="arq-warn"/>
  <text x="656" y="281" class="arq-t arq-xs arq-strong" text-anchor="middle">✗ vuelve a empezar</text>
  <text x="380" y="322" class="arq-t arq-s arq-strong" text-anchor="middle">rememberSaveable aguanta los tres porque Android guarda el Bundle fuera del proceso.</text>
</svg>
