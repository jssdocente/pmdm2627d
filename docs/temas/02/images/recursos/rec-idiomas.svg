<svg class="arq-svg" viewBox="0 0 760 360" role="img" aria-labelledby="arq-rid-t arq-rid-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-rid-t">Cómo elige Android el idioma de los textos</title>
  <desc id="arq-rid-d">El código es el mismo: stringResource de R.string.partidas_jugadas con el valor 3. Con el móvil en español, Android lee values/strings.xml, donde dice Partidas jugadas: %1$d, y muestra Partidas jugadas: 3. Con el móvil en inglés lee values-en/strings.xml, Games played: %1$d, y muestra Games played: 3. Hollow Knight es un dato del juego y no va en strings.xml.</desc>
  <defs>
    <marker id="arq-rid-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-rid-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="200" y="16" width="360" height="42" rx="10" class="arq-ui"/>
  <text x="380" y="42" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">stringResource(R.string.partidas_jugadas, 3)</text>
  <path d="M380,58 C380,80 190,76 190,98" class="arq-dep" marker-end="url(#arq-rid-a)"/>
  <text x="190" y="116" class="arq-t arq-s arq-strong" text-anchor="middle">🇪🇸 móvil en español</text>
  <rect x="40" y="128" width="300" height="62" rx="8" class="arq-dom"/>
  <text x="52" y="148" class="arq-t arq-code arq-xs arq-strong">values/strings.xml</text>
  <text x="52" y="170" class="arq-t arq-code arq-xs">&lt;string name="partidas_jugadas"&gt;</text>
  <text x="64" y="184" class="arq-t arq-code arq-xs">Partidas jugadas: %1$d</text>
  <line x1="190" y1="190" x2="190" y2="218" class="arq-dep" marker-end="url(#arq-rid-a)"/>
  <text x="200" y="208" class="arq-t arq-code arq-xs">%1$d → 3</text>
  <rect x="80" y="220" width="220" height="44" rx="10" class="arq-data"/>
  <text x="190" y="247" class="arq-t arq-s arq-strong" text-anchor="middle">Partidas jugadas: 3</text>
  <path d="M380,58 C380,80 570,76 570,98" class="arq-dep" marker-end="url(#arq-rid-a)"/>
  <text x="570" y="116" class="arq-t arq-s arq-strong" text-anchor="middle">🇬🇧 móvil en inglés</text>
  <rect x="420" y="128" width="300" height="62" rx="8" class="arq-dom"/>
  <text x="432" y="148" class="arq-t arq-code arq-xs arq-strong">values-en/strings.xml</text>
  <text x="432" y="170" class="arq-t arq-code arq-xs">&lt;string name="partidas_jugadas"&gt;</text>
  <text x="444" y="184" class="arq-t arq-code arq-xs">Games played: %1$d</text>
  <line x1="570" y1="190" x2="570" y2="218" class="arq-dep" marker-end="url(#arq-rid-a)"/>
  <text x="580" y="208" class="arq-t arq-code arq-xs">%1$d → 3</text>
  <rect x="460" y="220" width="220" height="44" rx="10" class="arq-data"/>
  <text x="570" y="247" class="arq-t arq-s arq-strong" text-anchor="middle">Games played: 3</text>
  <rect x="20" y="290" width="720" height="52" rx="10" class="arq-gray"/>
  <text x="380" y="312" class="arq-t arq-xs arq-strong" text-anchor="middle">«Hollow Knight» o «Metroidvania» no van en strings.xml: son datos del juego, no textos de la interfaz.</text>
  <text x="380" y="330" class="arq-t arq-xs" text-anchor="middle">Para otro idioma, otra carpeta: values-fr/strings.xml. El código Kotlin no cambia.</text>
</svg>
