<svg class="arq-svg" viewBox="0 0 760 330" role="img" aria-labelledby="arq-txc-t arq-txc-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-txc-t">El tema XML pinta la ventana; el tema de Compose, la interfaz</title>
  <desc id="arq-txc-d">Un móvil con la app abierta. La ventana, con su fondo inicial y las barras del sistema, la configura el tema XML Theme.LabUt2 de res/values/themes.xml, que el Manifest asigna con android:theme y que hereda de android:Theme.Material.Light.NoActionBar. El contenido que dibuja Compose usa los colores, la tipografía y las formas de LabUt2Theme, definido en Kotlin en ui/theme/Theme.kt.</desc>
  <defs>
    <marker id="arq-txc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-txc-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="40" y="20" width="190" height="296" rx="22" class="arq-dom"/>
  <rect x="52" y="34" width="166" height="16" rx="4" class="arq-gray"/>
  <text x="135" y="46" class="arq-t arq-xs" text-anchor="middle">barra de estado</text>
  <rect x="56" y="58" width="158" height="232" rx="8" class="arq-ui"/>
  <text x="135" y="84" class="arq-t arq-s arq-strong" text-anchor="middle">Contenido</text>
  <text x="135" y="100" class="arq-t arq-s arq-strong" text-anchor="middle">de Compose</text>
  <rect x="70" y="120" width="130" height="30" rx="15" class="arq-box"/>
  <text x="135" y="140" class="arq-t arq-code arq-xs" text-anchor="middle">Button</text>
  <rect x="70" y="162" width="130" height="58" rx="8" class="arq-box"/>
  <text x="135" y="186" class="arq-t arq-code arq-xs" text-anchor="middle">Card</text>
  <text x="135" y="204" class="arq-t arq-code arq-xs" text-anchor="middle">Text</text>
  <rect x="52" y="296" width="166" height="12" rx="4" class="arq-gray"/>
  <rect x="290" y="24" width="450" height="132" rx="10" class="arq-dom"/>
  <text x="306" y="48" class="arq-t arq-s arq-strong">Tema XML: la ventana</text>
  <text x="306" y="70" class="arq-t arq-code arq-xs">res/values/themes.xml</text>
  <text x="306" y="92" class="arq-t arq-code arq-xs">&lt;style name="Theme.LabUt2"</text>
  <text x="322" y="110" class="arq-t arq-code arq-xs">parent="android:Theme.Material.Light.NoActionBar" /&gt;</text>
  <text x="306" y="134" class="arq-t arq-s">Lo lee Android antes de tu código: fondo inicial, barras, splash.</text>
  <line x1="232" y1="90" x2="288" y2="90" class="arq-dep" marker-end="url(#arq-txc-a)" style="stroke-width:1.6"/>
  <rect x="290" y="176" width="450" height="124" rx="10" class="arq-ui"/>
  <text x="306" y="200" class="arq-t arq-s arq-strong">Tema de Compose: la interfaz</text>
  <text x="306" y="222" class="arq-t arq-code arq-xs">ui/theme/Theme.kt</text>
  <text x="306" y="244" class="arq-t arq-code arq-xs">LabUt2Theme { … }  →  MaterialTheme(colorScheme, …)</text>
  <text x="306" y="268" class="arq-t arq-s">Lo lee Compose a partir de setContent: colores, tipografía,</text>
  <text x="306" y="286" class="arq-t arq-s">formas de los componentes de Material 3.</text>
  <line x1="214" y1="240" x2="288" y2="240" class="arq-dep" marker-end="url(#arq-txc-a)" style="stroke-width:1.6"/>
</svg>
