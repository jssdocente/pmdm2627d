<svg class="arq-svg" viewBox="0 0 760 470" role="img" aria-labelledby="ut1-cap-t ut1-cap-d" xmlns="http://www.w3.org/2000/svg">
  <title id="ut1-cap-t">Capas entre tu código y el sistema en las cuatro opciones</title>
  <desc id="ut1-cap-d">Cuatro columnas. Web: tu código en HTML, CSS y JavaScript corre en el navegador. Híbrida: el mismo tipo de código corre en un WebView dentro de una app, con plugins. Multiplataforma: código en Dart, JavaScript o Kotlin con la capa del framework. Nativa: Kotlin y Compose llaman directamente a las APIs del sistema. Debajo, cómo se instala cada una y cuántas bases de código hacen falta.</desc>
  <defs><marker id="ut1-cap-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker></defs>
