<svg class="arq-svg" viewBox="0 0 760 340" role="img" aria-labelledby="ut1-fmt-t ut1-fmt-d" xmlns="http://www.w3.org/2000/svg">
  <title id="ut1-fmt-t">Una lógica compartida y una interfaz por formato</title>
  <desc id="ut1-fmt-d">Un módulo compartido en Kotlin con modelos, repositorios y casos de uso alimenta cinco interfaces: teléfono y tablet con Compose, Wear OS con Compose para Wear OS, Android TV con Compose para TV, coche con Car App Library, e iOS con SwiftUI o Compose Multiplatform, este último solo si el módulo es KMP.</desc>
  <defs><marker id="ut1-fmt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker></defs>
  <rect x="14" y="14" width="732" height="86" rx="8" class="arq-data"/>
  <text x="380" y="42" class="arq-t arq-h" text-anchor="middle">Módulo compartido en Kotlin</text>
  <text x="380" y="64" class="arq-t arq-s" text-anchor="middle">modelos, repositorios, casos de uso, red y base de datos</text>
  <text x="380" y="84" class="arq-t arq-xs" text-anchor="middle">Para los formatos Android basta un módulo Android normal. KMP solo hace falta si sales de Android.</text>
  <line x1="84.0" y1="102" x2="84.0" y2="150" class="arq-dep" marker-end="url(#ut1-fmt-a)"/>
  <rect x="14" y="154" width="140" height="100" rx="8" class="arq-ui"/>
  <text x="84.0" y="180" class="arq-t arq-s arq-strong" text-anchor="middle">Teléfono y tablet</text>
  <text x="84.0" y="206" class="arq-t arq-xs" text-anchor="middle">Compose</text>
  <text x="84.0" y="223" class="arq-t arq-xs" text-anchor="middle">Material 3</text>
  <line x1="232.0" y1="102" x2="232.0" y2="150" class="arq-dep" marker-end="url(#ut1-fmt-a)"/>
  <rect x="162" y="154" width="140" height="100" rx="8" class="arq-ui"/>
  <text x="232.0" y="180" class="arq-t arq-s arq-strong" text-anchor="middle">Wear OS</text>
  <text x="232.0" y="206" class="arq-t arq-xs" text-anchor="middle">Compose para</text>
  <text x="232.0" y="223" class="arq-t arq-xs" text-anchor="middle">Wear OS</text>
  <line x1="380.0" y1="102" x2="380.0" y2="150" class="arq-dep" marker-end="url(#ut1-fmt-a)"/>
  <rect x="310" y="154" width="140" height="100" rx="8" class="arq-ui"/>
  <text x="380.0" y="180" class="arq-t arq-s arq-strong" text-anchor="middle">Android TV</text>
  <text x="380.0" y="206" class="arq-t arq-xs" text-anchor="middle">Compose para TV</text>
  <text x="380.0" y="223" class="arq-t arq-xs" text-anchor="middle">tv-material</text>
  <line x1="528.0" y1="102" x2="528.0" y2="150" class="arq-dep" marker-end="url(#ut1-fmt-a)"/>
  <rect x="458" y="154" width="140" height="100" rx="8" class="arq-dom"/>
  <text x="528.0" y="180" class="arq-t arq-s arq-strong" text-anchor="middle">Coche</text>
  <text x="528.0" y="206" class="arq-t arq-xs" text-anchor="middle">Car App Library</text>
  <text x="528.0" y="223" class="arq-t arq-xs" text-anchor="middle">plantillas fijas</text>
  <line x1="676.0" y1="102" x2="676.0" y2="150" class="arq-dep arq-dashed" marker-end="url(#ut1-fmt-a)"/>
  <rect x="606" y="154" width="140" height="100" rx="8" class="arq-gray"/>
  <text x="676.0" y="180" class="arq-t arq-s arq-strong" text-anchor="middle">iOS, watchOS, tvOS</text>
  <text x="676.0" y="206" class="arq-t arq-xs" text-anchor="middle">SwiftUI</text>
  <text x="676.0" y="223" class="arq-t arq-xs" text-anchor="middle">(iOS: también CMP)</text>
  <line x1="14" y1="272" x2="746" y2="272" class="arq-guide"/>
  <text x="310" y="296" class="arq-t arq-s arq-strong" text-anchor="middle">Todo esto es Android: se llega sin KMP</text>
  <line x1="14" y1="308" x2="596" y2="308" class="arq-dep"/>
  <text x="676" y="296" class="arq-t arq-s arq-strong" text-anchor="middle">Requiere KMP</text>
  <line x1="606" y1="308" x2="746" y2="308" class="arq-dep arq-dashed"/>
  <text x="380" y="330" class="arq-t arq-xs arq-muted" text-anchor="middle">Android Auto corre en el móvil y Android Automotive OS en el propio coche; ambos usan plantillas al conducir.</text>
</svg>
