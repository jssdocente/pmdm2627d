  <text x="633.0" y="44" class="arq-t arq-xs arq-muted" text-anchor="middle">Se comparte también la interfaz</text>
  <text x="575" y="70" class="arq-t arq-s" text-anchor="middle">Android</text>
  <text x="691" y="70" class="arq-t arq-s" text-anchor="middle">iOS</text>
