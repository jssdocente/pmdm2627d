<svg class="arq-svg" viewBox="0 0 760 300" role="img" aria-labelledby="ut1-kmp-t ut1-kmp-d" xmlns="http://www.w3.org/2000/svg">
  <title id="ut1-kmp-t">Qué se comparte en nativo puro, KMP y Compose Multiplatform</title>
  <desc id="ut1-kmp-d">Tres escenarios para Android e iOS. Nativo puro: interfaz y lógica duplicadas. Kotlin Multiplatform: lógica compartida e interfaz nativa en cada plataforma. KMP con Compose Multiplatform: lógica e interfaz compartidas, salvo partes específicas.</desc>
  <defs><marker id="ut1-kmp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker></defs>
