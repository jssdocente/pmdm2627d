  <text x="127.0" y="44" class="arq-t arq-xs arq-muted" text-anchor="middle">Se escribe todo dos veces</text>
  <text x="69" y="70" class="arq-t arq-s" text-anchor="middle">Android</text>
  <text x="185" y="70" class="arq-t arq-s" text-anchor="middle">iOS</text>
  <text x="380.0" y="24" class="arq-t arq-strong" text-anchor="middle">KMP</text>
  <text x="380.0" y="44" class="arq-t arq-xs arq-muted" text-anchor="middle">Se comparte la lógica</text>
  <text x="322" y="70" class="arq-t arq-s" text-anchor="middle">Android</text>
