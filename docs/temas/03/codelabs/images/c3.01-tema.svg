<svg class="arq-svg" viewBox="0 0 760 290" role="img" aria-labelledby="arq-c301-t arq-c301-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c301-t">Las piezas del tema de Material 3</title>
  <desc id="arq-c301-d">Color.kt define la paleta, Type.kt la escala tipográfica y Shape.kt las esquinas. Theme.kt monta con la paleta dos esquemas, LightColorScheme y DarkColorScheme, elige uno según darkTheme y se lo pasa a MaterialTheme junto con Typography y Shapes. Los composables de dentro leen MaterialTheme.colorScheme, typography y shapes, y los componentes como Button o Card toman sus colores del tema sin que se los indiquemos.</desc>
  <defs>
    <marker id="arq-c301-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c301-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="20" y="30" width="180" height="54" rx="10" class="arq-dom"/>
  <text x="110" y="52" class="arq-t arq-code arq-strong" text-anchor="middle">Color.kt</text>
  <text x="110" y="72" class="arq-t arq-xs" text-anchor="middle">la paleta de colores</text>
  <rect x="20" y="114" width="180" height="54" rx="10" class="arq-dom"/>
  <text x="110" y="136" class="arq-t arq-code arq-strong" text-anchor="middle">Type.kt</text>
  <text x="110" y="156" class="arq-t arq-xs" text-anchor="middle">tamaños y pesos del texto</text>
  <rect x="20" y="198" width="180" height="54" rx="10" class="arq-dom"/>
  <text x="110" y="220" class="arq-t arq-code arq-strong" text-anchor="middle">Shape.kt</text>
  <text x="110" y="240" class="arq-t arq-xs" text-anchor="middle">esquinas small, medium y large</text>
  <rect x="250" y="20" width="260" height="250" rx="14" class="arq-ui"/>
  <text x="380" y="42" class="arq-t arq-code arq-strong" text-anchor="middle">Theme.kt · LabUt3Theme</text>
  <rect x="262" y="58" width="114" height="30" rx="8" class="arq-box"/>
  <text x="319" y="77" class="arq-t arq-xs arq-strong" text-anchor="middle">LightColorScheme</text>
  <rect x="384" y="58" width="114" height="30" rx="8" class="arq-box"/>
  <text x="441" y="77" class="arq-t arq-xs arq-strong" text-anchor="middle">DarkColorScheme</text>
  <text x="380" y="108" class="arq-t arq-xs arq-muted" text-anchor="middle">darkTheme elige uno de los dos</text>
  <rect x="266" y="122" width="228" height="134" rx="10" class="arq-box"/>
  <text x="282" y="146" class="arq-t arq-code">MaterialTheme(</text>
  <text x="298" y="172" class="arq-t arq-code">colorScheme = …,</text>
  <text x="298" y="198" class="arq-t arq-code">typography = Typography,</text>
  <text x="298" y="224" class="arq-t arq-code">shapes = Shapes</text>
  <text x="282" y="246" class="arq-t arq-code">)</text>
  <line x1="200" y1="57" x2="258" y2="70" class="arq-dep" marker-end="url(#arq-c301-a)"/>
  <line x1="200" y1="141" x2="292" y2="190" class="arq-dep" marker-end="url(#arq-c301-a)"/>
  <line x1="200" y1="225" x2="292" y2="222" class="arq-dep" marker-end="url(#arq-c301-a)"/>
  <rect x="545" y="40" width="210" height="210" rx="14" class="arq-data"/>
  <text x="650" y="64" class="arq-t arq-s arq-strong" text-anchor="middle">Los composables</text>
  <text x="650" y="84" class="arq-t arq-xs arq-muted" text-anchor="middle">leen MaterialTheme…</text>
  <text x="557" y="112" class="arq-t arq-code">.colorScheme.primary</text>
  <text x="557" y="138" class="arq-t arq-code">.typography.titleLarge</text>
  <text x="557" y="164" class="arq-t arq-code">.shapes.medium</text>
  <text x="650" y="198" class="arq-t arq-xs" text-anchor="middle">Button, Card, Switch…</text>
  <text x="650" y="214" class="arq-t arq-xs" text-anchor="middle">toman sus colores del tema</text>
  <text x="650" y="230" class="arq-t arq-xs" text-anchor="middle">sin que se los digamos</text>
  <line x1="510" y1="145" x2="541" y2="145" class="arq-dep" marker-end="url(#arq-c301-a)"/>
</svg>
