<svg class="arq-svg" viewBox="0 0 760 290" role="img" aria-labelledby="arq-c307-t arq-c307-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c307-t">De la carpeta res a la pantalla</title>
  <desc id="arq-c307-d">En res están las imágenes, en drawable, y los textos: values/strings.xml en español, el idioma por defecto, y values-en/strings.xml en inglés. Al compilar se genera la clase R con un identificador para cada recurso: R.drawable.ic_hero_mage, R.string.heroe_vida y R.array.habilidades_mago. En Compose se cargan con painterResource, stringResource y stringArrayResource. stringResource rellena los huecos del texto: con 60 y 120 sale Vida 60 de 120 en español o HP 60 de 120 en inglés, según el idioma del móvil.</desc>
  <defs>
    <marker id="arq-c307-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c307-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="14" y="20" width="222" height="256" rx="12" class="arq-box arq-dashed"/>
  <text x="30" y="42" class="arq-t arq-code arq-strong">res/</text>
  <rect x="26" y="56" width="198" height="50" rx="8" class="arq-dom"/>
  <text x="38" y="76" class="arq-t arq-code arq-xs arq-strong">drawable/</text>
  <text x="38" y="96" class="arq-t arq-xs">ic_hero_mage.xml…</text>
  <rect x="26" y="118" width="198" height="66" rx="8" class="arq-data"/>
  <text x="38" y="138" class="arq-t arq-code arq-xs arq-strong">values/strings.xml</text>
  <text x="38" y="158" class="arq-t arq-xs">Vida: %1$d / %2$d</text>
  <text x="38" y="174" class="arq-t arq-xs arq-muted">idioma por defecto</text>
  <rect x="26" y="196" width="198" height="66" rx="8" class="arq-ui"/>
  <text x="38" y="216" class="arq-t arq-code arq-xs arq-strong">values-en/strings.xml</text>
  <text x="38" y="236" class="arq-t arq-xs">HP: %1$d / %2$d</text>
  <text x="38" y="252" class="arq-t arq-xs arq-muted">si el móvil está en inglés</text>
  <rect x="280" y="60" width="200" height="176" rx="12" class="arq-box" style="stroke-width:2"/>
  <text x="380" y="84" class="arq-t arq-s arq-strong" text-anchor="middle">clase R (generada)</text>
  <text x="294" y="124" class="arq-t arq-code arq-xs">R.drawable.ic_hero_mage</text>
  <text x="294" y="164" class="arq-t arq-code arq-xs">R.string.heroe_vida</text>
  <text x="294" y="204" class="arq-t arq-code arq-xs">R.array.habilidades_mago</text>
  <line x1="224" y1="81" x2="288" y2="114" class="arq-dep" marker-end="url(#arq-c307-a)"/>
  <line x1="224" y1="151" x2="288" y2="160" class="arq-dep" marker-end="url(#arq-c307-a)"/>
  <line x1="224" y1="229" x2="288" y2="172" class="arq-guide"/>
  <text x="530" y="40" class="arq-t arq-s arq-strong">En Compose</text>
  <text x="530" y="124" class="arq-t arq-code arq-xs">painterResource(…)</text>
  <text x="530" y="164" class="arq-t arq-code arq-xs">stringResource(…, 60, 120)</text>
  <text x="530" y="204" class="arq-t arq-code arq-xs">stringArrayResource(…)</text>
  <line x1="480" y1="120" x2="522" y2="120" class="arq-dep" marker-end="url(#arq-c307-a)"/>
  <line x1="480" y1="160" x2="522" y2="160" class="arq-dep" marker-end="url(#arq-c307-a)"/>
  <line x1="480" y1="200" x2="522" y2="200" class="arq-dep" marker-end="url(#arq-c307-a)"/>
  <rect x="530" y="222" width="100" height="40" rx="8" class="arq-data"/>
  <text x="580" y="247" class="arq-t arq-xs arq-strong" text-anchor="middle">Vida: 60 / 120</text>
  <rect x="640" y="222" width="100" height="40" rx="8" class="arq-ui"/>
  <text x="690" y="247" class="arq-t arq-xs arq-strong" text-anchor="middle">HP: 60 / 120</text>
  <line x1="610" y1="172" x2="590" y2="218" class="arq-guide"/>
  <line x1="610" y1="172" x2="680" y2="218" class="arq-guide"/>
</svg>
