<svg class="arq-svg" viewBox="0 0 760 340" role="img" aria-labelledby="arq-c303s-t arq-c303s-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c303s-t">Los huecos de Scaffold en la lista de tareas</title>
  <desc id="arq-c303s-d">Scaffold coloca cada pieza en su sitio. Arriba, el topBar con la TopAppBar Mis tareas. En el centro, el contenido, que recibe innerPadding: el espacio que ocupan la barra superior y las barras del sistema, para que la lista empiece debajo y no quede tapada. Abajo a la derecha, el floatingActionButton con el más. Abajo a la izquierda, el snackbarHost, donde aparece el aviso Tarea borrada con la acción Deshacer.</desc>
  <defs>
    <marker id="arq-c303s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c303s-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="250" y="14" width="280" height="312" rx="24" class="arq-box" style="stroke-width:2"/>
  <text x="270" y="32" class="arq-t arq-xs arq-muted">barra de estado</text>
  <rect x="250" y="40" width="280" height="46" class="arq-ui"/>
  <text x="268" y="68" class="arq-t arq-strong">Mis tareas</text>
  <rect x="262" y="96" width="256" height="160" rx="8" class="arq-data arq-dashed"/>
  <rect x="274" y="108" width="232" height="26" rx="6" class="arq-box"/>
  <rect x="274" y="142" width="232" height="26" rx="6" class="arq-box"/>
  <rect x="274" y="176" width="232" height="26" rx="6" class="arq-box"/>
  <text x="390" y="232" class="arq-t arq-xs arq-strong" text-anchor="middle">contenido (la LazyColumn)</text>
  <rect x="262" y="270" width="180" height="40" rx="6" class="arq-gray"/>
  <text x="274" y="294" class="arq-t arq-xs">Tarea borrada</text>
  <text x="432" y="294" class="arq-t arq-xs arq-strong" text-anchor="end">Deshacer</text>
  <rect x="464" y="262" width="52" height="52" rx="16" class="arq-ui"/>
  <text x="490" y="296" class="arq-t arq-strong" style="font-size:24px" text-anchor="middle">+</text>
  <line x1="200" y1="63" x2="246" y2="63" class="arq-guide"/>
  <text x="196" y="68" class="arq-t arq-code" text-anchor="end">topBar</text>
  <line x1="200" y1="176" x2="258" y2="176" class="arq-guide"/>
  <text x="196" y="172" class="arq-t arq-code" text-anchor="end">content =</text>
  <text x="196" y="190" class="arq-t arq-code" text-anchor="end">{ innerPadding -&gt; }</text>
  <line x1="200" y1="290" x2="258" y2="290" class="arq-guide"/>
  <text x="196" y="295" class="arq-t arq-code" text-anchor="end">snackbarHost</text>
  <line x1="520" y1="288" x2="560" y2="288" class="arq-guide"/>
  <text x="566" y="293" class="arq-t arq-code">floatingActionButton</text>
  <line x1="545" y1="14" x2="545" y2="96" class="arq-dep" marker-start="url(#arq-c303s-a)" marker-end="url(#arq-c303s-a)"/>
  <text x="560" y="44" class="arq-t arq-code arq-strong">innerPadding</text>
  <text x="560" y="64" class="arq-t arq-xs">el hueco de las barras:</text>
  <text x="560" y="80" class="arq-t arq-xs">aplícalo al contenido para</text>
  <text x="560" y="96" class="arq-t arq-xs">que nada quede tapado</text>
</svg>
