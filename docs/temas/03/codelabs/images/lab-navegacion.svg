<svg class="arq-svg" viewBox="0 0 760 390" role="img" aria-labelledby="arq-lab3-t arq-lab3-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-lab3-t">La navegación del laboratorio de la UT3</title>
  <desc id="arq-lab3-d">MainActivity crea un Scaffold y le pasa a LabApp el innerPadding y consumeWindowInsets. LabApp guarda con rememberSaveable qué pantalla se ve, y un when elige qué pintar: el menú, una de las siete pantallas de los codelabs o uno de los tres retos. El menú avisa con onAbrir de la pantalla elegida, y el botón Menú o el botón atrás del sistema vuelven a poner pantalla igual a MENU.</desc>
