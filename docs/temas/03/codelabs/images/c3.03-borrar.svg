<svg class="arq-svg" viewBox="0 0 760 250" role="img" aria-labelledby="arq-c303b-t arq-c303b-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-c303b-t">Borrar una tarea: diálogo, Snackbar y deshacer</title>
  <desc id="arq-c303b-d">Al pulsar la papelera se guarda la tarea en tareaABorrar. Mientras tareaABorrar no es null se muestra el AlertDialog. Con Cancelar, tareaABorrar vuelve a null y no pasa nada. Con Borrar, la tarea se quita de la lista y se lanza una corrutina que muestra el Snackbar y espera la respuesta. Si el usuario pulsa Deshacer, el resultado es ActionPerformed y la tarea vuelve a su posición.</desc>
  <defs>
    <marker id="arq-c303b-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-c303b-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="10" y="20" width="170" height="80" rx="10" class="arq-ui"/>
  <text x="95" y="44" class="arq-t arq-xs arq-strong" text-anchor="middle">1. Pulsar la papelera</text>
  <text x="95" y="72" class="arq-t arq-code" text-anchor="middle">tareaABorrar</text>
  <text x="95" y="90" class="arq-t arq-code" text-anchor="middle">= tarea</text>
  <rect x="200" y="20" width="170" height="80" rx="10" class="arq-box" style="stroke-width:2"/>
  <text x="285" y="44" class="arq-t arq-xs arq-strong" text-anchor="middle">2. AlertDialog</text>
  <text x="285" y="64" class="arq-t arq-xs" text-anchor="middle">se muestra mientras</text>
  <text x="285" y="86" class="arq-t arq-code" text-anchor="middle">tareaABorrar != null</text>
  <rect x="390" y="20" width="170" height="80" rx="10" class="arq-dom"/>
  <text x="475" y="44" class="arq-t arq-xs arq-strong" text-anchor="middle">3. Botón Borrar</text>
  <text x="475" y="66" class="arq-t arq-code" text-anchor="middle">tareas.remove(…)</text>
  <text x="475" y="88" class="arq-t arq-code" text-anchor="middle">scope.launch {</text>
  <rect x="580" y="20" width="170" height="80" rx="10" class="arq-gray"/>
  <text x="665" y="44" class="arq-t arq-xs arq-strong" text-anchor="middle">4. Snackbar</text>
  <text x="665" y="66" class="arq-t arq-code" text-anchor="middle">showSnackbar(…)</text>
  <text x="665" y="86" class="arq-t arq-xs" text-anchor="middle">espera a que acabe</text>
  <line x1="180" y1="60" x2="196" y2="60" class="arq-dep" marker-end="url(#arq-c303b-a)"/>
  <line x1="370" y1="60" x2="386" y2="60" class="arq-dep" marker-end="url(#arq-c303b-a)"/>
  <line x1="560" y1="60" x2="576" y2="60" class="arq-dep" marker-end="url(#arq-c303b-a)"/>
  <line x1="285" y1="100" x2="285" y2="156" class="arq-flow" marker-end="url(#arq-c303b-f)"/>
  <text x="295" y="134" class="arq-t arq-xs arq-strong">Cancelar</text>
  <rect x="200" y="160" width="170" height="56" rx="10" class="arq-box"/>
  <text x="285" y="186" class="arq-t arq-code" text-anchor="middle">tareaABorrar</text>
  <text x="285" y="204" class="arq-t arq-code" text-anchor="middle">= null</text>
  <line x1="665" y1="100" x2="665" y2="156" class="arq-flow" marker-end="url(#arq-c303b-f)"/>
  <text x="675" y="134" class="arq-t arq-xs arq-strong">Deshacer</text>
  <rect x="560" y="160" width="190" height="76" rx="10" class="arq-data"/>
  <text x="655" y="182" class="arq-t arq-code arq-xs" text-anchor="middle">ActionPerformed</text>
  <text x="655" y="204" class="arq-t arq-code" text-anchor="middle">tareas.add(posicion,</text>
  <text x="655" y="224" class="arq-t arq-code" text-anchor="middle">tarea)</text>
</svg>
