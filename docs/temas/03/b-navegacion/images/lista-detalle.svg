<g font-size="10"><rect x="10" y="40" width="110" height="24" rx="3" fill="#ece6f0"/><text x="16" y="56">Hollow Knight</text><rect x="10" y="70" width="110" height="24" rx="3" fill="#e8def8" stroke="#6750a4"/><text x="16" y="86">Zelda</text><rect x="10" y="100" width="110" height="24" rx="3" fill="#ece6f0"/><text x="16" y="116">Celeste</text></g>
<path d="M128 8 v204" stroke="#cac4d0"/>
<rect x="136" y="12" width="164" height="20" rx="3" fill="#d3e3fd"/><text x="142" y="26" font-size="10">Zelda</text>
<rect x="136" y="40" width="164" height="90" rx="4" fill="#cfe8d5"/><rect x="136" y="138" width="120" height="8" rx="2" fill="#ece6f0"/><rect x="136" y="152" width="160" height="8" rx="2" fill="#ece6f0"/><rect x="136" y="166" width="140" height="8" rx="2" fill="#ece6f0"/>
