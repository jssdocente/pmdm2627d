<svg class="arq-svg" viewBox="0 0 760 470" role="img" aria-labelledby="arq-sus-t arq-sus-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-sus-t">Qué es real y qué se sustituye en cada tipo de test</title>
  <desc id="arq-sus-d">En el test de dominio, el caso de uso es real y el repositorio es un FakeJuegoRepositorio. En el test de ViewModel, el ViewModel y los casos de uso son reales, el repositorio es el fake y Dispatchers.Main se sustituye con MainDispatcherRule. En el test de interfaz, la pantalla stateless es real y recibe un estado inventado y lambdas que anotan lo que pasa, sin ViewModel ni Koin.</desc>
  <defs>
    <marker id="arq-sus-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
  </defs>
  <!-- Leyenda -->
  <rect x="150" y="12" width="34" height="20" rx="5" class="arq-dom"/>
  <text x="192" y="27" class="arq-t arq-s">pieza real: lo que se prueba</text>
  <rect x="420" y="12" width="34" height="20" rx="5" class="arq-gray arq-dashed"/>
  <text x="462" y="27" class="arq-t arq-s">pieza de prueba: sustituye a la real</text>
  <!-- Fila 1: dominio -->
  <text x="20" y="84" class="arq-t arq-h">Dominio</text>
  <text x="20" y="102" class="arq-t arq-xs arq-muted">src/test · JVM</text>
  <rect x="150" y="66" width="150" height="44" rx="8" class="arq-box"/>
  <text x="225" y="85" class="arq-t arq-code arq-xs" text-anchor="middle">ObtenerJuegos</text>
  <text x="225" y="101" class="arq-t arq-code arq-xs" text-anchor="middle">UseCaseTest</text>
  <line x1="300" y1="88" x2="330" y2="88" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="332" y="66" width="190" height="44" rx="8" class="arq-dom"/>
  <text x="427" y="93" class="arq-t arq-code arq-strong" text-anchor="middle">ObtenerJuegosUseCase</text>
  <line x1="522" y1="88" x2="552" y2="88" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="554" y="66" width="186" height="44" rx="8" class="arq-gray arq-dashed"/>
  <text x="647" y="85" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FakeJuegoRepositorio</text>
  <text x="647" y="101" class="arq-t arq-xs arq-muted" text-anchor="middle">en vez del repositorio real</text>
  <line x1="20" y1="140" x2="740" y2="140" class="arq-guide"/>
  <!-- Fila 2: ViewModel -->
  <text x="20" y="206" class="arq-t arq-h">ViewModel</text>
  <text x="20" y="224" class="arq-t arq-xs arq-muted">src/test · JVM</text>
  <rect x="150" y="168" width="150" height="44" rx="8" class="arq-box"/>
  <text x="225" y="187" class="arq-t arq-code arq-xs" text-anchor="middle">CatalogoView</text>
  <text x="225" y="203" class="arq-t arq-code arq-xs" text-anchor="middle">ModelTest</text>
  <line x1="300" y1="190" x2="330" y2="190" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="332" y="168" width="190" height="44" rx="8" class="arq-ui"/>
  <text x="427" y="195" class="arq-t arq-code arq-strong" text-anchor="middle">CatalogoViewModel</text>
  <line x1="522" y1="190" x2="552" y2="190" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="554" y="168" width="186" height="44" rx="8" class="arq-dom"/>
  <text x="647" y="187" class="arq-t arq-code arq-xs" text-anchor="middle">ObtenerJuegos, Alternar…</text>
  <text x="647" y="203" class="arq-t arq-xs" text-anchor="middle">casos de uso reales</text>
  <line x1="647" y1="212" x2="647" y2="236" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="554" y="238" width="186" height="36" rx="8" class="arq-gray arq-dashed"/>
  <text x="647" y="261" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">FakeJuegoRepositorio</text>
  <line x1="427" y1="212" x2="427" y2="236" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="332" y="238" width="190" height="36" rx="8" class="arq-gray arq-dashed"/>
  <text x="427" y="261" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">MainDispatcherRule</text>
  <text x="427" y="292" class="arq-t arq-xs arq-muted" text-anchor="middle">sustituye a Dispatchers.Main</text>
  <line x1="20" y1="310" x2="740" y2="310" class="arq-guide"/>
  <!-- Fila 3: interfaz -->
  <text x="20" y="376" class="arq-t arq-h">Interfaz</text>
  <text x="20" y="394" class="arq-t arq-xs arq-muted">src/androidTest</text>
  <text x="20" y="408" class="arq-t arq-xs arq-muted">emulador</text>
  <rect x="150" y="358" width="150" height="44" rx="8" class="arq-box"/>
  <text x="225" y="377" class="arq-t arq-code arq-xs" text-anchor="middle">PantallaCatalogo</text>
  <text x="225" y="393" class="arq-t arq-code arq-xs" text-anchor="middle">Test</text>
  <line x1="300" y1="380" x2="330" y2="380" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <rect x="332" y="358" width="190" height="44" rx="8" class="arq-ui"/>
  <text x="427" y="377" class="arq-t arq-code arq-strong" text-anchor="middle">PantallaCatalogo</text>
  <text x="427" y="393" class="arq-t arq-xs" text-anchor="middle">stateless: recibe estado y lambdas</text>
  <text x="427" y="422" class="arq-t arq-xs arq-strong" text-anchor="middle">sin ViewModel ni Koin</text>
  <rect x="554" y="326" width="186" height="44" rx="8" class="arq-gray arq-dashed"/>
  <text x="647" y="345" class="arq-t arq-xs arq-strong" text-anchor="middle">estado inventado</text>
  <text x="647" y="361" class="arq-t arq-code arq-xs" text-anchor="middle">Exito(listOf(zelda))</text>
  <rect x="554" y="380" width="186" height="44" rx="8" class="arq-gray arq-dashed"/>
  <text x="647" y="399" class="arq-t arq-xs arq-strong" text-anchor="middle">lambdas que anotan</text>
  <text x="647" y="415" class="arq-t arq-code arq-xs" text-anchor="middle">{ idPulsado = it }</text>
  <line x1="554" y1="348" x2="524" y2="368" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <line x1="554" y1="402" x2="524" y2="392" class="arq-dep" marker-end="url(#arq-sus-a)"/>
  <!-- Idea -->
  <text x="380" y="458" class="arq-t arq-s arq-strong" text-anchor="middle">Cada test usa de verdad la pieza que prueba y sustituye lo que tiene debajo, gracias a recibirlo por el constructor.</text>
</svg>
