<svg class="arq-svg" viewBox="0 0 760 380" role="img" aria-labelledby="arq-pir-t arq-pir-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-pir-t">Pirámide de tests de la app de juegos</title>
  <desc id="arq-pir-d">Abajo, muchos tests de dominio de los casos de uso; en medio, bastantes tests de ViewModel; arriba, pocos tests de interfaz de las pantallas. Los dos pisos de abajo son tests locales en app/src/test, que se ejecutan en el ordenador en milisegundos. El piso de arriba son tests instrumentados en app/src/androidTest, que necesitan un emulador o un móvil y tardan segundos.</desc>
  <!-- Pisos -->
  <polygon points="172,30 288,30 330,130 130,130" class="arq-ui"/>
  <text x="230" y="70" class="arq-t arq-strong" text-anchor="middle">Interfaz</text>
  <text x="230" y="90" class="arq-t arq-code arq-xs" text-anchor="middle">PantallaCatalogo</text>
  <text x="230" y="112" class="arq-t arq-xs arq-muted" text-anchor="middle">pocos</text>
  <polygon points="128,136 332,136 374,236 86,236" class="arq-ui"/>
  <text x="230" y="176" class="arq-t arq-strong" text-anchor="middle">ViewModel</text>
  <text x="230" y="196" class="arq-t arq-code arq-xs" text-anchor="middle">CatalogoViewModel</text>
  <text x="230" y="218" class="arq-t arq-xs arq-muted" text-anchor="middle">bastantes</text>
  <polygon points="84,242 376,242 420,342 40,342" class="arq-dom"/>
  <text x="230" y="282" class="arq-t arq-strong" text-anchor="middle">Dominio</text>
  <text x="230" y="302" class="arq-t arq-code arq-xs" text-anchor="middle">ObtenerJuegos, AlternarFavorito…</text>
  <text x="230" y="324" class="arq-t arq-xs arq-muted" text-anchor="middle">muchos · Kotlin puro</text>
  <!-- Dónde se ejecutan -->
  <path d="M440,30 L452,30 L452,130 L440,130" class="arq-dep" style="stroke-width:1.6"/>
  <rect x="466" y="40" width="274" height="82" rx="12" class="arq-warn"/>
  <text x="480" y="62" class="arq-t arq-s arq-strong">Tests instrumentados</text>
  <text x="480" y="80" class="arq-t arq-code arq-xs">app/src/androidTest/</text>
  <text x="480" y="98" class="arq-t arq-xs">📱 emulador o móvil · segundos</text>
  <text x="480" y="114" class="arq-t arq-code arq-xs">./gradlew connectedAndroidTest</text>
  <path d="M440,136 L452,136 L452,342 L440,342" class="arq-dep" style="stroke-width:1.6"/>
  <rect x="466" y="198" width="274" height="82" rx="12" class="arq-data"/>
  <text x="480" y="220" class="arq-t arq-s arq-strong">Tests locales</text>
  <text x="480" y="238" class="arq-t arq-code arq-xs">app/src/test/</text>
  <text x="480" y="256" class="arq-t arq-xs">💻 tu ordenador (JVM) · milisegundos</text>
  <text x="480" y="272" class="arq-t arq-code arq-xs">./gradlew test</text>
  <!-- Coste -->
  <text x="380" y="370" class="arq-t arq-xs arq-muted" text-anchor="middle">Cuanto más arriba, más lento y más frágil: por eso hay menos. Los de abajo son tan rápidos que se ejecutan a cada cambio.</text>
</svg>
