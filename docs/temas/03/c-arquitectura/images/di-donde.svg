<svg class="arq-svg" viewBox="0 0 760 380" role="img" aria-labelledby="arq-don-t arq-don-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-don-t">Dónde vive Koin en la arquitectura</title>
  <desc id="arq-don-d">Encima de las tres capas está el paquete di con MiApp y los módulos de Koin. Es el único sitio que conoce todas las clases, incluidas las implementaciones concretas como JuegoRepositorioEnMemoria. Las capas siguen dependiendo solo del dominio.</desc>
  <defs>
    <marker id="arq-don-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-don-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-muted"/></marker>
  </defs>
  <!-- di -->
  <rect x="20" y="16" width="720" height="78" rx="14" class="arq-gray"/>
  <text x="380" y="42" class="arq-t arq-h" text-anchor="middle">di/ · MiApp + módulos de Koin</text>
  <text x="380" y="62" class="arq-t arq-s" text-anchor="middle">El único sitio que conoce <tspan class="arq-strong">todas</tspan> las clases, también las implementaciones concretas.</text>
  <text x="380" y="80" class="arq-t arq-xs arq-muted" text-anchor="middle">Aquí se decide qué se enchufa en cada toma: «JuegoRepositorio → JuegoRepositorioEnMemoria».</text>
  <!-- Flechas "conoce" -->
  <line x1="120" y1="94" x2="120" y2="140" class="arq-guide" marker-end="url(#arq-don-g)"/>
  <line x1="380" y1="94" x2="380" y2="140" class="arq-guide" marker-end="url(#arq-don-g)"/>
  <line x1="640" y1="94" x2="640" y2="140" class="arq-guide" marker-end="url(#arq-don-g)"/>
  <text x="128" y="122" class="arq-t arq-xs arq-muted">viewModelOf(…)</text>
  <text x="388" y="122" class="arq-t arq-xs arq-muted">factoryOf(…)</text>
  <text x="648" y="122" class="arq-t arq-xs arq-muted">singleOf(…) bind</text>
  <!-- Capas -->
  <rect x="20" y="144" width="200" height="140" rx="14" class="arq-ui"/>
  <text x="120" y="170" class="arq-t arq-h" text-anchor="middle">Presentación</text>
  <text x="120" y="200" class="arq-t arq-code" text-anchor="middle">CatalogoViewModel</text>
  <text x="120" y="222" class="arq-t arq-code" text-anchor="middle">DetalleViewModel</text>
  <rect x="280" y="144" width="200" height="140" rx="14" class="arq-dom"/>
  <text x="380" y="170" class="arq-t arq-h" text-anchor="middle">Dominio</text>
  <text x="380" y="200" class="arq-t arq-code" text-anchor="middle">JuegoRepositorio</text>
  <text x="380" y="222" class="arq-t arq-code" text-anchor="middle">…UseCase</text>
  <rect x="540" y="144" width="200" height="140" rx="14" class="arq-data"/>
  <text x="640" y="170" class="arq-t arq-h" text-anchor="middle">Datos</text>
  <text x="640" y="200" class="arq-t arq-code" text-anchor="middle">JuegoRepositorio</text>
  <text x="640" y="220" class="arq-t arq-code" text-anchor="middle">EnMemoria</text>
  <line x1="220" y1="250" x2="278" y2="250" class="arq-dep" marker-end="url(#arq-don-a)"/>
  <line x1="540" y1="250" x2="482" y2="250" class="arq-dep" marker-end="url(#arq-don-a)"/>
  <text x="120" y="268" class="arq-t arq-xs arq-muted" text-anchor="middle">pide interfaces, no clases</text>
  <text x="640" y="268" class="arq-t arq-xs arq-muted" text-anchor="middle">implementa la interfaz</text>
  <!-- Nota -->
  <text x="380" y="318" class="arq-t arq-s arq-strong" text-anchor="middle">Las capas siguen sin conocerse entre sí: solo dependen del dominio.</text>
  <text x="380" y="340" class="arq-t arq-s" text-anchor="middle">En UT4, pasar de EnMemoria a Room es cambiar una línea de datosModule:</text>
  <text x="380" y="362" class="arq-t arq-code arq-strong" text-anchor="middle">singleOf(::JuegoRepositorioRoom) bind JuegoRepositorio::class</text>
</svg>
