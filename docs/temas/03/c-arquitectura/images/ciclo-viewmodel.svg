<svg class="arq-svg" viewBox="0 0 760 360" role="img" aria-labelledby="arq-ciclo-t arq-ciclo-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-ciclo-t">Ciclo de vida del ViewModel frente al de la Activity</title>
  <desc id="arq-ciclo-d">Al girar el móvil o cambiar a modo oscuro, la Activity se destruye y se vuelve a crear, y el estado guardado con remember se pierde. El ViewModel es la misma instancia durante todo el tiempo y solo se destruye, con onCleared, al salir de la pantalla.</desc>
  <!-- Momentos -->
  <line x1="170" y1="62" x2="170" y2="250" class="arq-guide"/>
  <line x1="360" y1="62" x2="360" y2="250" class="arq-guide"/>
  <line x1="540" y1="62" x2="540" y2="250" class="arq-guide"/>
  <line x1="712" y1="62" x2="712" y2="250" class="arq-guide"/>
  <text x="170" y="30" class="arq-t arq-s arq-strong" text-anchor="middle">Abres</text>
  <text x="170" y="47" class="arq-t arq-s" text-anchor="middle">la pantalla</text>
  <text x="360" y="30" class="arq-t arq-s arq-strong" text-anchor="middle">🔄 Giras</text>
  <text x="360" y="47" class="arq-t arq-s" text-anchor="middle">el móvil</text>
  <text x="540" y="30" class="arq-t arq-s arq-strong" text-anchor="middle">🌙 Cambias</text>
  <text x="540" y="47" class="arq-t arq-s" text-anchor="middle">a modo oscuro</text>
  <text x="700" y="30" class="arq-t arq-s arq-strong" text-anchor="middle">⬅ Sales</text>
  <text x="700" y="47" class="arq-t arq-s" text-anchor="middle">de la pantalla</text>
  <!-- Activity -->
  <text x="20" y="96" class="arq-t arq-strong">Activity</text>
  <text x="20" y="113" class="arq-t arq-xs arq-muted">se recrea en cada</text>
  <text x="20" y="126" class="arq-t arq-xs arq-muted">cambio de configuración</text>
  <rect x="172" y="84" width="184" height="32" rx="8" class="arq-bar-act"/>
  <text x="264" y="105" class="arq-t arq-s" text-anchor="middle">Activity nº 1</text>
  <rect x="364" y="84" width="172" height="32" rx="8" class="arq-bar-act"/>
  <text x="450" y="105" class="arq-t arq-s" text-anchor="middle">Activity nº 2</text>
  <rect x="544" y="84" width="166" height="32" rx="8" class="arq-bar-act"/>
  <text x="627" y="105" class="arq-t arq-s" text-anchor="middle">Activity nº 3</text>
  <!-- ViewModel -->
  <text x="20" y="160" class="arq-t arq-strong">ViewModel</text>
  <text x="20" y="177" class="arq-t arq-xs arq-muted">una sola instancia</text>
  <rect x="172" y="148" width="538" height="32" rx="8" class="arq-bar-vm"/>
  <text x="441" y="169" class="arq-t arq-s arq-on arq-strong" text-anchor="middle">AhorcadoViewModel: la misma instancia, con la partida intacta</text>
  <text x="712" y="200" class="arq-t arq-xs arq-strong" text-anchor="end">onCleared()</text>
  <!-- remember -->
  <text x="20" y="226" class="arq-t arq-strong">remember { }</text>
  <text x="20" y="243" class="arq-t arq-xs arq-muted">vive en la Activity</text>
  <rect x="172" y="214" width="184" height="32" rx="8" class="arq-bar-lost"/>
  <rect x="364" y="214" width="172" height="32" rx="8" class="arq-bar-lost"/>
  <rect x="544" y="214" width="166" height="32" rx="8" class="arq-bar-lost"/>
  <text x="360" y="235" class="arq-t arq-strong arq-red" text-anchor="middle">✗</text>
  <text x="540" y="235" class="arq-t arq-strong arq-red" text-anchor="middle">✗</text>
  <text x="450" y="235" class="arq-t arq-xs" text-anchor="middle">vuelve a empezar</text>
  <text x="627" y="235" class="arq-t arq-xs" text-anchor="middle">vuelve a empezar</text>
  <text x="264" y="235" class="arq-t arq-xs" text-anchor="middle">partida en curso</text>
  <!-- Cierre del proceso -->
  <rect x="20" y="272" width="720" height="72" rx="10" class="arq-warn"/>
  <text x="36" y="296" class="arq-t arq-s arq-strong">⚠ Ojo: si Android cierra la app en segundo plano para liberar memoria, también se pierde el ViewModel.</text>
  <text x="36" y="316" class="arq-t arq-s">Lo que no deba perderse nunca va en rememberSaveable o SavedStateHandle (estado pequeño de la pantalla)</text>
  <text x="36" y="334" class="arq-t arq-s">o en la capa de datos (lo importante: la biblioteca, los favoritos…).</text>
</svg>
