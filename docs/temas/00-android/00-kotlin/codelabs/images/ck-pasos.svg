<svg class="arq-svg" viewBox="0 0 760 184" role="img" aria-labelledby="arq-cks-t arq-cks-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-cks-t">Los siete pasos del codelab</title>
  <desc id="arq-cks-d">Siete pasos en fila. Los pasos 1 y 2 modelan los datos, los pasos 3 y 4 los transforman, y los pasos 5, 6 y 7 trabajan con el tiempo. Los pasos 1, 3, 5 y 7 forman la ruta mínima.</desc>
  <defs>
    <marker id="arq-cks-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-cks-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <line x1="16" y1="34" x2="219" y2="34" class="arq-dep"/>
  <text x="117.5" y="24" class="arq-t arq-xs arq-strong" text-anchor="middle">Modelar datos</text>
  <line x1="226" y1="34" x2="429" y2="34" class="arq-dep"/>
  <text x="327.5" y="24" class="arq-t arq-xs arq-strong" text-anchor="middle">Transformar datos</text>
  <line x1="436" y1="34" x2="744" y2="34" class="arq-dep"/>
  <text x="590.0" y="24" class="arq-t arq-xs arq-strong" text-anchor="middle">Trabajar con el tiempo</text>
  <rect x="16" y="46" width="98" height="88" rx="8" class="arq-ui"/>
  <text x="65.0" y="72" class="arq-t arq-h" text-anchor="middle">1</text>
  <text x="65.0" y="96" class="arq-t arq-xs" text-anchor="middle">Tipos</text>
  <text x="65.0" y="112" class="arq-t arq-xs" text-anchor="middle">sellados</text>
  <text x="65.0" y="154" class="arq-t arq-s arq-strong" text-anchor="middle">★</text>
  <rect x="121" y="46" width="98" height="88" rx="8" class="arq-ui"/>
  <text x="170.0" y="72" class="arq-t arq-h" text-anchor="middle">2</text>
  <text x="170.0" y="104" class="arq-t arq-xs" text-anchor="middle">Genéricos</text>
  <rect x="226" y="46" width="98" height="88" rx="8" class="arq-data"/>
  <text x="275.0" y="72" class="arq-t arq-h" text-anchor="middle">3</text>
  <text x="275.0" y="96" class="arq-t arq-xs" text-anchor="middle">Colecciones</text>
  <text x="275.0" y="112" class="arq-t arq-xs" text-anchor="middle">y Maps</text>
  <text x="275.0" y="154" class="arq-t arq-s arq-strong" text-anchor="middle">★</text>
  <rect x="331" y="46" width="98" height="88" rx="8" class="arq-data"/>
  <text x="380.0" y="72" class="arq-t arq-h" text-anchor="middle">4</text>
  <text x="380.0" y="96" class="arq-t arq-xs" text-anchor="middle">Scope</text>
  <text x="380.0" y="112" class="arq-t arq-xs" text-anchor="middle">functions</text>
  <rect x="436" y="46" width="98" height="88" rx="8" class="arq-dom"/>
  <text x="485.0" y="72" class="arq-t arq-h" text-anchor="middle">5</text>
  <text x="485.0" y="96" class="arq-t arq-xs" text-anchor="middle">suspend y</text>
  <text x="485.0" y="112" class="arq-t arq-xs" text-anchor="middle">async</text>
  <text x="485.0" y="154" class="arq-t arq-s arq-strong" text-anchor="middle">★</text>
  <rect x="541" y="46" width="98" height="88" rx="8" class="arq-dom"/>
  <text x="590.0" y="72" class="arq-t arq-h" text-anchor="middle">6</text>
  <text x="590.0" y="96" class="arq-t arq-xs" text-anchor="middle">Cancelación</text>
  <text x="590.0" y="112" class="arq-t arq-xs" text-anchor="middle">y errores</text>
  <rect x="646" y="46" width="98" height="88" rx="8" class="arq-dom"/>
  <text x="695.0" y="72" class="arq-t arq-h" text-anchor="middle">7</text>
  <text x="695.0" y="96" class="arq-t arq-xs" text-anchor="middle">Flow y</text>
  <text x="695.0" y="112" class="arq-t arq-xs" text-anchor="middle">StateFlow</text>
  <text x="695.0" y="154" class="arq-t arq-s arq-strong" text-anchor="middle">★</text>
  <text x="380" y="176" class="arq-t arq-xs arq-muted" text-anchor="middle">★ Ruta mínima si vas justo de tiempo</text>
</svg>
