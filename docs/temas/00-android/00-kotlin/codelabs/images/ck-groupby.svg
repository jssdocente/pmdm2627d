  <text x="602" y="65" class="arq-t arq-xs arq-strong">Completada</text>
  <text x="730" y="65" class="arq-t arq-xs arq-strong" text-anchor="end">1200</text>
  <rect x="300" y="93" width="210" height="45" rx="5" class="arq-ui"/>
  <text x="312" y="112" class="arq-t arq-xs arq-strong">Descargando</text>
  <text x="312" y="129" class="arq-t arq-xs">musica.zip</text>
  <rect x="590" y="93" width="150" height="45" rx="5" class="arq-ui"/>
  <text x="602" y="120" class="arq-t arq-xs arq-strong">Descargando</text>
