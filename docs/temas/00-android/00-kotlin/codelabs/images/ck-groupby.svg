<svg class="arq-svg" viewBox="0 0 760 276" role="img" aria-labelledby="arq-ckg-t arq-ckg-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-ckg-t">De una lista a un mapa con groupBy y mapValues</title>
  <desc id="arq-ckg-d">Una lista de cinco descargas. groupBy las reparte en un mapa cuya clave es el nombre del estado y cuyo valor es la lista de descargas. mapValues conserva las claves y convierte cada lista en la suma de sus megas.</desc>
  <defs>
    <marker id="arq-ckg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-ckg-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="115" y="22" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:11.5px">List&lt;Descarga&gt;</text>
  <text x="405" y="22" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:11.5px">Map&lt;String, List&lt;Descarga&gt;&gt;</text>
  <text x="665" y="22" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:11.5px">Map&lt;String, Int&gt;</text>
  <rect x="20" y="38" width="190" height="36" rx="5" class="arq-data"/>
  <text x="115" y="61" class="arq-t arq-xs" text-anchor="middle">mapa.zip · 300 MB</text>
  <rect x="20" y="82" width="190" height="36" rx="5" class="arq-ui"/>
  <text x="115" y="105" class="arq-t arq-xs" text-anchor="middle">musica.zip · 120 MB</text>
  <rect x="20" y="126" width="190" height="36" rx="5" class="arq-data"/>
  <text x="115" y="149" class="arq-t arq-xs" text-anchor="middle">video.zip · 900 MB</text>
  <rect x="20" y="170" width="190" height="36" rx="5" class="arq-gray"/>
  <text x="115" y="193" class="arq-t arq-xs" text-anchor="middle">texturas.zip · 500 MB</text>
  <rect x="20" y="214" width="190" height="36" rx="5" class="arq-warn"/>
  <text x="115" y="237" class="arq-t arq-xs" text-anchor="middle">voces.zip · 80 MB</text>
  <rect x="300" y="38" width="210" height="45" rx="5" class="arq-data"/>
