  <rect x="202" y="386" width="26" height="26" rx="6" class="arq-ui"/>
  <text x="215" y="404" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">1</text>
  <rect x="232" y="386" width="26" height="26" rx="6" class="arq-ui"/>
  <text x="245" y="404" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">2</text>
  <rect x="262" y="386" width="26" height="26" rx="6" class="arq-ui"/>
  <text x="274" y="404" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">3</text>
</svg>
