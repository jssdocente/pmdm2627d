<svg class="arq-svg" viewBox="0 0 590 298" style="max-width:590px" role="img" aria-labelledby="colgby-t colgby-d" xmlns="http://www.w3.org/2000/svg">
  <title id="colgby-t">groupBy por categoría</title>
  <desc id="colgby-d">Mando y Funda, de Accesorios, van a la lista de la clave Accesorios. Cascos y Altavoz, de Audio, van a la de la clave Audio. No se pierde ningún producto.</desc>
  <defs>
    <marker id="colgby-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="colgby-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="20" y="26" class="arq-t arq-code arq-strong" style="font-size:13.5px">val porCategoria = catalogo.groupBy { it.categoria }</text>
  <text x="20" y="48" class="arq-t arq-muted arq-s">La lambda da la clave; cada valor es la lista de productos con esa clave.</text>
  <text x="20" y="82" class="arq-t arq-code arq-muted" style="font-size:12px">catalogo: List&lt;Producto&gt;</text>
  <text x="570" y="82" class="arq-t arq-code arq-muted" text-anchor="end" style="font-size:12px">Map&lt;String, List&lt;Producto&gt;&gt;</text>
  <rect x="20" y="100" width="190" height="32" rx="6" class="arq-gray"/>
  <text x="32" y="121" class="arq-t arq-code" style="font-size:13.5px">Mando · <tspan style="fill:#4a7dff;font-weight:700">Accesorios</tspan></text>
  <rect x="20" y="142" width="190" height="32" rx="6" class="arq-gray"/>
  <text x="32" y="163" class="arq-t arq-code" style="font-size:13.5px">Funda · <tspan style="fill:#4a7dff;font-weight:700">Accesorios</tspan></text>
  <rect x="20" y="184" width="190" height="32" rx="6" class="arq-gray"/>
  <text x="32" y="205" class="arq-t arq-code" style="font-size:13.5px">Cascos · <tspan style="fill:#4a7dff;font-weight:700">Audio</tspan></text>
  <rect x="20" y="226" width="190" height="32" rx="6" class="arq-gray"/>
  <text x="32" y="247" class="arq-t arq-code" style="font-size:13.5px">Altavoz · <tspan style="fill:#4a7dff;font-weight:700">Audio</tspan></text>
  <rect x="300" y="116" width="110" height="50" rx="6" class="arq-ui"/>
  <text x="355" y="146" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:13.5px">Accesorios</text>
  <rect x="414" y="116" width="156" height="50" rx="6" class="arq-data"/>
  <rect x="424" y="127" width="56" height="28" rx="6" class="arq-box"/>
  <text x="452" y="146" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">Mando</text>
  <rect x="486" y="127" width="56" height="28" rx="6" class="arq-box"/>
  <text x="513" y="146" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">Funda</text>
  <path d="M214,116 L294,141" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colgby-a)"/>
  <path d="M214,158 L294,141" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colgby-a)"/>
  <rect x="300" y="200" width="110" height="50" rx="6" class="arq-ui"/>
  <text x="355" y="230" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:13.5px">Audio</text>
  <rect x="414" y="200" width="156" height="50" rx="6" class="arq-data"/>
  <rect x="424" y="211" width="63" height="28" rx="6" class="arq-box"/>
  <text x="456" y="230" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">Cascos</text>
  <rect x="493" y="211" width="70" height="28" rx="6" class="arq-box"/>
  <text x="528" y="230" class="arq-t arq-code" text-anchor="middle" style="font-size:12.5px">Altavoz</text>
  <path d="M214,200 L294,225" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colgby-a)"/>
  <path d="M214,242 L294,225" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colgby-a)"/>
  <text x="20" y="282" class="arq-t arq-s" style="fill:#2eaa6e">A diferencia de associateBy, ningún producto se pierde aunque la clave se repita.</text>
