<svg class="arq-svg" viewBox="0 0 480 206" style="max-width:480px" role="img" aria-labelledby="colawith-t colawith-d" xmlns="http://www.w3.org/2000/svg">
  <title id="colawith-t">associateWith con la longitud</title>
  <desc id="colawith-d">Cada nombre pasa a ser la clave y la lambda it.length da el valor: Ana 3 y Luisa 5.</desc>
  <defs>
    <marker id="colawith-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="colawith-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="20" y="26" class="arq-t arq-code arq-strong" style="font-size:13.5px">val longitudes = nombres.associateWith { it.length }</text>
  <text x="20" y="48" class="arq-t arq-muted arq-s">El elemento es la clave; la lambda da el valor.</text>
  <text x="20" y="82" class="arq-t arq-code arq-muted" style="font-size:12px">nombres: List&lt;String&gt;</text>
  <text x="270" y="82" class="arq-t arq-code arq-muted" style="font-size:12px">Map&lt;String, Int&gt;</text>
  <text x="315" y="100" class="arq-t arq-muted arq-xs" text-anchor="middle">clave</text>
  <text x="394" y="100" class="arq-t arq-muted arq-xs" text-anchor="middle">valor</text>
  <rect x="20" y="108" width="100" height="32" rx="6" class="arq-gray"/>
  <text x="70" y="129" class="arq-t arq-code" text-anchor="middle" style="font-size:13.5px">"Ana"</text>
  <path d="M126,124 L264,124" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colawith-a)"/>
  <text x="195" y="118" class="arq-t arq-code arq-muted" text-anchor="middle" style="font-size:12px">it.length = 3</text>
  <rect x="270" y="108" width="90" height="32" rx="6" class="arq-ui"/>
  <text x="315" y="129" class="arq-t arq-code" text-anchor="middle" style="font-size:13.5px">Ana</text>
  <rect x="364" y="108" width="60" height="32" rx="6" class="arq-data"/>
  <text x="394" y="129" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:13.5px">3</text>
  <rect x="20" y="152" width="100" height="32" rx="6" class="arq-gray"/>
  <text x="70" y="173" class="arq-t arq-code" text-anchor="middle" style="font-size:13.5px">"Luisa"</text>
  <path d="M126,168 L264,168" class="arq-dep" style="stroke-width:1.6" marker-end="url(#colawith-a)"/>
  <text x="195" y="162" class="arq-t arq-code arq-muted" text-anchor="middle" style="font-size:12px">it.length = 5</text>
  <rect x="270" y="152" width="90" height="32" rx="6" class="arq-ui"/>
  <text x="315" y="173" class="arq-t arq-code" text-anchor="middle" style="font-size:13.5px">Luisa</text>
  <rect x="364" y="152" width="60" height="32" rx="6" class="arq-data"/>
  <text x="394" y="173" class="arq-t arq-code arq-strong" text-anchor="middle" style="font-size:13.5px">5</text>
</svg>
