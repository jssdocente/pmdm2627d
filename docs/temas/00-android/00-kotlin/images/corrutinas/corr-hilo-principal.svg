  <text x="20" y="278" class="arq-t arq-xs arq-muted">la corrutina</text>
  <rect x="217.5" y="264" width="6" height="20" rx="2" class="arq-data"/>
  <rect x="225.5" y="264" width="372" height="20" rx="3" class="arq-gray arq-dashed"/>
  <text x="447.5" y="278" class="arq-t arq-xs" text-anchor="middle">suspendida: esperando la red</text>
  <rect x="597.5" y="264" width="14" height="20" rx="2" class="arq-data"/>
