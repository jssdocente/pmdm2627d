<svg class="arq-svg" viewBox="0 0 760 360" role="img" aria-labelledby="arq-chp-t arq-chp-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-chp-t">Bloquear el hilo principal frente a suspender una corrutina</title>
  <desc id="arq-chp-d">Dos situaciones durante 6 segundos. Con Thread.sleep en el hilo principal, la app deja de pintar fotogramas, ignora el toque del usuario y, si dura unos 5 segundos, aparece el diálogo ANR. Con delay dentro de una corrutina, el hilo principal sigue pintando fotogramas y responde al toque mientras la corrutina espera suspendida; al final se reanuda y pinta el resultado.</desc>
  <defs>
    <marker id="arq-chp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-chp-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="217.5" y="22" class="arq-t arq-xs arq-strong" text-anchor="middle">pulsa «Cargar»</text>
  <line x1="217.5" y1="28" x2="217.5" y2="300" class="arq-guide"/>
  <text x="360" y="22" class="arq-t arq-xs arq-strong" text-anchor="middle">👆 toca un botón</text>
  <line x1="360" y1="28" x2="360" y2="300" class="arq-guide"/>
  <text x="20" y="64" class="arq-t arq-code arq-xs arq-strong">Thread.sleep(4000)</text>
  <text x="20" y="80" class="arq-t arq-xs arq-muted">en el hilo principal</text>
  <text x="20" y="108" class="arq-t arq-xs arq-muted">hilo principal</text>
  <line x1="170" y1="104" x2="740" y2="104" class="arq-guide"/>
  <rect x="171.0" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="194.8" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="598.5" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="622.2" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="646.0" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="669.8" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="693.5" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="717.2" y="94" width="20.75" height="20" rx="2" class="arq-ui"/>
  <rect x="217.5" y="94" width="380" height="20" rx="3" class="arq-bar-lost"/>
  <text x="447.5" y="108" class="arq-t arq-xs arq-strong" text-anchor="middle">bloqueado: no pinta ni responde</text>
  <text x="360" y="136" class="arq-t arq-xs arq-strong" text-anchor="middle">✗ toque ignorado</text>
  <rect x="586" y="50" width="154" height="26" rx="6" class="arq-warn"/>
  <text x="663" y="67" class="arq-t arq-xs arq-strong" text-anchor="middle">⚠ si llega a ~5 s: ANR</text>
  <line x1="20" y1="160" x2="740" y2="160" class="arq-guide"/>
  <text x="20" y="194" class="arq-t arq-code arq-xs arq-strong">delay(4000)</text>
  <text x="20" y="210" class="arq-t arq-xs arq-muted">dentro de launch { }</text>
  <text x="20" y="238" class="arq-t arq-xs arq-muted">hilo principal</text>
