  <title id="arq-cwc-t">Una corrutina cambia de hilo con withContext</title>
  <desc id="arq-cwc-d">Tres carriles: Main, IO y Default. La corrutina empieza en Main con viewModelScope.launch, salta a IO para leer un fichero, vuelve a Main para actualizar el estado, salta a Default para ordenar una lista enorme y vuelve a Main para pintar. Mientras trabaja en IO o en Default, el hilo principal sigue libre y pintando.</desc>
