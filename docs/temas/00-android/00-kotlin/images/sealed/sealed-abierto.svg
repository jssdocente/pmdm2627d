<svg class="arq-svg" viewBox="0 0 760 330" role="img" aria-labelledby="arq-sab-t arq-sab-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-sab-t">Jerarquía abierta frente a jerarquía sellada</title>
  <desc id="arq-sab-d">A la izquierda, una interface normal Notificacion con Email, SMS y Push: cualquiera, en cualquier módulo, puede añadir Fax, así que un when necesita else. A la derecha, una sealed interface con los mismos tres subtipos dentro de un recinto con el rótulo mismo módulo y paquete; intentar añadir Fax desde otro módulo no compila, y el when no necesita else.</desc>
  <defs>
    <marker id="arq-sab-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-sab-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="190" y="24" class="arq-t arq-h" text-anchor="middle">interface (abierta)</text>
  <text x="570" y="24" class="arq-t arq-h" text-anchor="middle">sealed interface (cerrada)</text>
  <rect x="110" y="44" width="160" height="36" rx="8" class="arq-ui"/>
  <text x="190.0" y="66.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Notificacion</text>
  <rect x="20" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="65.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Email</text>
  <line x1="190" y1="80" x2="65" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="130" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="175.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">SMS</text>
  <line x1="190" y1="80" x2="175" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="240" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="285.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Push</text>
  <line x1="190" y1="80" x2="285" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="130" y="214" width="120" height="32" rx="8" class="arq-gray arq-dashed"/>
  <text x="190.0" y="234.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Fax ?</text>
  <line x1="190" y1="80" x2="190" y2="212" class="arq-guide"/>
  <text x="190" y="268" class="arq-t arq-xs" text-anchor="middle">Cualquiera, en cualquier módulo,</text>
  <text x="190" y="284" class="arq-t arq-xs" text-anchor="middle">puede añadir un subtipo nuevo.</text>
  <text x="190" y="306" class="arq-t arq-s arq-strong" text-anchor="middle">El when necesita else</text>
  <line x1="380" y1="20" x2="380" y2="320" class="arq-guide"/>
  <rect x="410" y="38" width="320" height="140" rx="16" class="arq-dom" style="fill-opacity:0.35"/>
  <text x="720" y="56" class="arq-t arq-xs arq-strong" text-anchor="end">mismo módulo y paquete</text>
  <rect x="490" y="62" width="160" height="36" rx="8" class="arq-ui"/>
  <text x="570.0" y="84.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Notificacion</text>
  <rect x="420" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="465.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Email</text>
  <line x1="570" y1="98" x2="465" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="524" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="569.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">SMS</text>
  <line x1="570" y1="98" x2="569" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="628" y="128" width="90" height="32" rx="8" class="arq-ui"/>
  <text x="673.0" y="148.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Push</text>
  <line x1="570" y1="98" x2="673" y2="126" class="arq-dep" marker-end="url(#arq-sab-a)"/>
  <rect x="510" y="214" width="120" height="32" rx="8" class="arq-warn arq-dashed"/>
  <text x="570.0" y="234.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Fax ✕</text>
  <text x="570" y="268" class="arq-t arq-xs" text-anchor="middle">Desde otro módulo: no compila.</text>
  <text x="570" y="284" class="arq-t arq-xs" text-anchor="middle">El compilador conoce los 3 subtipos.</text>
  <text x="570" y="306" class="arq-t arq-s arq-strong" text-anchor="middle">El when no necesita else</text>
</svg>
