<svg class="arq-svg" viewBox="0 0 760 280" role="img" aria-labelledby="arq-sen-t arq-sen-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-sen-t">enum frente a tipo sellado</title>
  <desc id="arq-sen-d">A la izquierda, un enum Plataforma con PC, SWITCH y PS5: tres cajas iguales, cada una con los mismos campos y una única instancia. A la derecha, CatalogoUiState con Cargando sin datos, Exito con listaJuegos y totalRegistros, y Error con mensaje y codigoHttp: cajas distintas, cada una con sus datos, y se crean instancias nuevas cada vez.</desc>
  <defs>
    <marker id="arq-sen-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-sen-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <text x="190" y="24" class="arq-t arq-h arq-code" text-anchor="middle">enum class Plataforma</text>
  <rect x="20" y="48" width="104" height="84" rx="8" class="arq-gray"/>
  <text x="72.0" y="78.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">PC</text>
  <text x="72.0" y="94.0" class="arq-t arq-code arq-xs" text-anchor="middle">nombre</text>
  <text x="72.0" y="110.0" class="arq-t arq-code arq-xs" text-anchor="middle">fabricante</text>
  <rect x="136" y="48" width="104" height="84" rx="8" class="arq-gray"/>
  <text x="188.0" y="78.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">SWITCH</text>
  <text x="188.0" y="94.0" class="arq-t arq-code arq-xs" text-anchor="middle">nombre</text>
  <text x="188.0" y="110.0" class="arq-t arq-code arq-xs" text-anchor="middle">fabricante</text>
  <rect x="252" y="48" width="104" height="84" rx="8" class="arq-gray"/>
  <text x="304.0" y="78.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">PS5</text>
  <text x="304.0" y="94.0" class="arq-t arq-code arq-xs" text-anchor="middle">nombre</text>
  <text x="304.0" y="110.0" class="arq-t arq-code arq-xs" text-anchor="middle">fabricante</text>
  <text x="190" y="160" class="arq-t arq-xs" text-anchor="middle">Las mismas casillas en todas.</text>
  <text x="190" y="176" class="arq-t arq-xs" text-anchor="middle">Una única instancia de cada constante.</text>
  <line x1="380" y1="20" x2="380" y2="270" class="arq-guide"/>
  <text x="570" y="24" class="arq-t arq-h arq-code" text-anchor="middle">sealed interface CatalogoUiState</text>
  <rect x="400" y="48" width="96" height="44" rx="8" class="arq-ui"/>
  <text x="448.0" y="66.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Cargando</text>
  <text x="448.0" y="82.0" class="arq-t arq-code arq-xs" text-anchor="middle">—</text>
  <rect x="506" y="48" width="124" height="100" rx="8" class="arq-ui"/>
  <text x="568.0" y="86.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Exito</text>
  <text x="568.0" y="102.0" class="arq-t arq-code arq-xs" text-anchor="middle">listaJuegos</text>
  <text x="568.0" y="118.0" class="arq-t arq-code arq-xs" text-anchor="middle">totalRegistros</text>
  <rect x="640" y="48" width="104" height="72" rx="8" class="arq-ui"/>
  <text x="692.0" y="72.0" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Error</text>
  <text x="692.0" y="88.0" class="arq-t arq-code arq-xs" text-anchor="middle">mensaje</text>
  <text x="692.0" y="104.0" class="arq-t arq-code arq-xs" text-anchor="middle">codigoHttp</text>
  <text x="570" y="176" class="arq-t arq-xs" text-anchor="middle">Cada subtipo, sus propios datos.</text>
  <text x="570" y="192" class="arq-t arq-xs" text-anchor="middle">Exito(...) y Error(...): una instancia nueva cada vez.</text>
  <text x="380" y="240" class="arq-t arq-s arq-strong" text-anchor="middle">enum: un valor de una lista fija.  sealed: un tipo de una lista fija, cada uno con su forma.</text>
</svg>
