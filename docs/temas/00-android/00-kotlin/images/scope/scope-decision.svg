<svg class="arq-svg" viewBox="0 0 760 420" role="img" aria-labelledby="arq-sdc-t arq-sdc-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-sdc-t">Cómo elegir la scope function</title>
  <desc id="arq-sdc-d">Primera pregunta: ¿quieres que te devuelva el propio objeto? Si es que sí: si vas a asignar sus propiedades, apply; si solo quieres hacer algo más con él, como un log, also. Si quieres un resultado: si el objeto puede ser null o lo vas a pasar a otra función, let; si ya lo tienes en una variable y solo agrupas llamadas, with; en otro caso, run.</desc>
  <defs>
    <marker id="arq-sdc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-sdc-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="215.0" y="14" width="330" height="52" rx="12" class="arq-gray"/>
  <text x="380" y="36" class="arq-t arq-s arq-strong" text-anchor="middle">¿Quieres que te devuelva</text>
  <text x="380" y="54" class="arq-t arq-s arq-strong" text-anchor="middle">el propio objeto?</text>
  <line x1="300" y1="66" x2="200" y2="118" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="232" y="88" class="arq-t arq-s arq-strong" text-anchor="end">Sí</text>
  <line x1="460" y1="66" x2="560" y2="118" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="528" y="88" class="arq-t arq-s arq-strong" text-anchor="start">No: un resultado</text>
  <rect x="50.0" y="120" width="280" height="52" rx="12" class="arq-gray"/>
  <text x="190" y="142" class="arq-t arq-s arq-strong" text-anchor="middle">¿Vas a asignar</text>
  <text x="190" y="160" class="arq-t arq-s arq-strong" text-anchor="middle">sus propiedades?</text>
  <rect x="420.0" y="120" width="300" height="52" rx="12" class="arq-gray"/>
  <text x="570" y="142" class="arq-t arq-s arq-strong" text-anchor="middle">¿Puede ser null o lo pasas</text>
  <text x="570" y="160" class="arq-t arq-s arq-strong" text-anchor="middle">a otra función como argumento?</text>
  <line x1="140" y1="172" x2="100" y2="236" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="108" y="204" class="arq-t arq-xs arq-strong" text-anchor="end">Sí</text>
  <line x1="240" y1="172" x2="280" y2="236" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="272" y="204" class="arq-t arq-xs arq-strong" text-anchor="start">No, solo un log…</text>
  <rect x="25" y="240" width="130" height="62" rx="12" class="arq-ui"/>
  <text x="90" y="264" class="arq-t arq-h arq-code" text-anchor="middle">apply</text>
  <text x="90" y="282" class="arq-t arq-xs" text-anchor="middle">configurar</text>
  <text x="90" y="296" class="arq-t arq-code arq-xs" text-anchor="middle">Obj().apply { }</text>
  <rect x="225" y="240" width="130" height="62" rx="12" class="arq-ui"/>
  <text x="290" y="264" class="arq-t arq-h arq-code" text-anchor="middle">also</text>
  <text x="290" y="282" class="arq-t arq-xs" text-anchor="middle">«y además…»</text>
  <text x="290" y="296" class="arq-t arq-code arq-xs" text-anchor="middle">x.also { log }</text>
  <line x1="500" y1="172" x2="450" y2="236" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="466" y="204" class="arq-t arq-xs arq-strong" text-anchor="end">Sí</text>
  <line x1="640" y1="172" x2="650" y2="206" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="654" y="196" class="arq-t arq-xs arq-strong" text-anchor="start">No</text>
  <rect x="385" y="240" width="130" height="62" rx="12" class="arq-ui"/>
  <text x="450" y="264" class="arq-t arq-h arq-code" text-anchor="middle">let</text>
  <text x="450" y="282" class="arq-t arq-xs" text-anchor="middle">transformar / nulos</text>
  <text x="450" y="296" class="arq-t arq-code arq-xs" text-anchor="middle">x?.let { }</text>
  <rect x="550.0" y="206" width="200" height="52" rx="12" class="arq-gray"/>
  <text x="650" y="228" class="arq-t arq-s arq-strong" text-anchor="middle">¿Ya está en una variable</text>
  <text x="650" y="246" class="arq-t arq-s arq-strong" text-anchor="middle">y solo agrupas llamadas?</text>
  <line x1="600" y1="258" x2="560" y2="322" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="570" y="292" class="arq-t arq-xs arq-strong" text-anchor="end">Sí</text>
  <line x1="700" y1="258" x2="690" y2="322" class="arq-dep" marker-end="url(#arq-sdc-a)"/>
  <text x="700" y="292" class="arq-t arq-xs arq-strong" text-anchor="start">No</text>
  <rect x="480" y="326" width="130" height="62" rx="12" class="arq-ui"/>
  <text x="545" y="350" class="arq-t arq-h arq-code" text-anchor="middle">with</text>
  <text x="545" y="368" class="arq-t arq-xs" text-anchor="middle">agrupar llamadas</text>
  <text x="545" y="382" class="arq-t arq-code arq-xs" text-anchor="middle">with(x) { }</text>
  <rect x="620" y="326" width="130" height="62" rx="12" class="arq-ui"/>
  <text x="685" y="350" class="arq-t arq-h arq-code" text-anchor="middle">run</text>
  <text x="685" y="368" class="arq-t arq-xs" text-anchor="middle">calcular algo</text>
  <text x="685" y="382" class="arq-t arq-code arq-xs" text-anchor="middle">x.run { }</text>
</svg>
