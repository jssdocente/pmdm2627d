<svg class="arq-svg" viewBox="0 0 760 244" role="img" aria-labelledby="gm-ciclo-t gm-ciclo-d" xmlns="http://www.w3.org/2000/svg">
  <title id="gm-ciclo-t">Del rojo al verde</title>
  <desc id="gm-ciclo-d">Ciclo de cuatro pasos: lanzar los tests, con el botón de IntelliJ o con gradlew test, leer qué test falla y por qué, programar un método con un pipeline y volver a lanzar los tests, hasta que no falle ninguno. Si completas los métodos en orden, los fallos bajan así: 8 al empezar, 6 tras el método 1, 4 tras el 2, 3 tras el 3, 2 tras el 4 y 0 tras el 5.</desc>
  <defs>
    <marker id="gm-ciclo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="gm-ciclo-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="20" y="16" width="160" height="62" rx="10" class="arq-box"/>
  <text x="100" y="41" class="arq-t arq-s arq-strong" text-anchor="middle">1. Lanza los tests</text>
  <text x="100" y="62" class="arq-t arq-s arq-muted" text-anchor="middle">▶ o ./gradlew test</text>
  <line x1="180" y1="47" x2="204" y2="47" class="arq-dep" marker-end="url(#gm-ciclo-a)"/>
  <rect x="206" y="16" width="160" height="62" rx="10" class="arq-box"/>
  <text x="286" y="41" class="arq-t arq-s arq-strong" text-anchor="middle">2. Lee el fallo</text>
  <text x="286" y="62" class="arq-t arq-s arq-muted" text-anchor="middle">qué test y por qué</text>
  <line x1="366" y1="47" x2="390" y2="47" class="arq-dep" marker-end="url(#gm-ciclo-a)"/>
  <rect x="392" y="16" width="160" height="62" rx="10" class="arq-box"/>
  <text x="472" y="41" class="arq-t arq-s arq-strong" text-anchor="middle">3. Programa</text>
  <text x="472" y="62" class="arq-t arq-s arq-muted" text-anchor="middle">un método, con pipeline</text>
  <line x1="552" y1="47" x2="576" y2="47" class="arq-dep" marker-end="url(#gm-ciclo-a)"/>
  <rect x="578" y="16" width="160" height="62" rx="10" class="arq-box"/>
  <text x="658" y="41" class="arq-t arq-s arq-strong" text-anchor="middle">4. Repite</text>
  <text x="658" y="62" class="arq-t arq-s arq-muted" text-anchor="middle">vuelve a lanzar</text>
  <path d="M658,78 L658,100 L100,100 L100,81" class="arq-flow" marker-end="url(#gm-ciclo-f)"/>
  <text x="380" y="118" class="arq-t arq-xs" text-anchor="middle">hasta que no falle ninguno</text>
  <text x="20" y="150" class="arq-t arq-s arq-strong">Lo que verás si completas los métodos en orden</text>
