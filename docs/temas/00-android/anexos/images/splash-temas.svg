<svg class="arq-svg" viewBox="0 0 760 250" role="img" aria-labelledby="arq-stm-t arq-stm-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-stm-t">Los dos temas XML de la pantalla de inicio</title>
  <desc id="arq-stm-d">Theme.MiApp.Splash hereda de Theme.SplashScreen, que trae la biblioteca core-splashscreen, y define el fondo y el icono. El Manifest se lo asigna a la Activity de arranque. Con postSplashScreenTheme indica el tema al que se cambia al terminar: Theme.MiApp, el tema normal de la app, que hereda de android:Theme.Material.Light.NoActionBar.</desc>
  <defs>
    <marker id="arq-stm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head"/></marker>
    <marker id="arq-stm-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arq-head-flow"/></marker>
  </defs>
  <rect x="20" y="20" width="300" height="58" rx="10" class="arq-gray"/>
  <text x="170" y="44" class="arq-t arq-code arq-strong" text-anchor="middle">Theme.SplashScreen</text>
  <text x="170" y="64" class="arq-t arq-xs arq-muted" text-anchor="middle">biblioteca core-splashscreen</text>
  <rect x="20" y="150" width="300" height="70" rx="10" class="arq-dom"/>
  <text x="170" y="174" class="arq-t arq-code arq-strong" text-anchor="middle">Theme.MiApp.Splash</text>
  <text x="170" y="194" class="arq-t arq-s" text-anchor="middle">fondo + icono</text>
  <text x="170" y="210" class="arq-t arq-xs arq-muted" text-anchor="middle">lo asigna el Manifest a la Activity</text>
  <line x1="170" y1="148" x2="170" y2="82" class="arq-dep" marker-end="url(#arq-stm-a)"/>
  <text x="180" y="120" class="arq-t arq-code arq-xs">parent</text>
  <rect x="440" y="20" width="300" height="58" rx="10" class="arq-gray"/>
  <text x="590" y="44" class="arq-t arq-code arq-strong" text-anchor="middle">android:Theme.Material…</text>
  <text x="590" y="64" class="arq-t arq-xs arq-muted" text-anchor="middle">lo trae Android</text>
  <rect x="440" y="150" width="300" height="70" rx="10" class="arq-data"/>
  <text x="590" y="174" class="arq-t arq-code arq-strong" text-anchor="middle">Theme.MiApp</text>
  <text x="590" y="194" class="arq-t arq-s" text-anchor="middle">el tema normal de la ventana</text>
  <text x="590" y="210" class="arq-t arq-xs arq-muted" text-anchor="middle">(ya existe en el proyecto)</text>
  <line x1="590" y1="148" x2="590" y2="82" class="arq-dep" marker-end="url(#arq-stm-a)"/>
  <text x="600" y="120" class="arq-t arq-code arq-xs">parent</text>
  <line x1="322" y1="185" x2="436" y2="185" class="arq-flow" marker-end="url(#arq-stm-f)"/>
  <text x="379" y="170" class="arq-t arq-code arq-xs" text-anchor="middle">postSplash…</text>
  <text x="379" y="206" class="arq-t arq-xs arq-muted" text-anchor="middle">al terminar</text>
</svg>
