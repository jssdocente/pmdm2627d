<svg class="arq-svg" viewBox="0 0 760 340" role="img" aria-labelledby="arq-mrec-t arq-mrec-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-mrec-t">Qué se recompone al pulsar una carta del Memory</title>
  <desc id="arq-mrec-d">Árbol de la pantalla del tablero después de pulsar la carta 3, que pasa de boca abajo a boca arriba. Se recomponen, resaltados, TableroScreen porque lee el estado nuevo, TableroContent, la cuadrícula LazyVerticalGrid y CartaView 3. Se saltan, en gris, el Marcador, porque los movimientos no han cambiado, y las otras cinco cartas, cuyos datos son los mismos.</desc>
  <rect x="280" y="16" width="200" height="38" rx="8" class="arq-dom"/>
  <text x="380" y="31" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">TableroScreen</text>
  <text x="380" y="47" class="arq-t arq-xs" text-anchor="middle">lee el estado nuevo</text>
  <rect x="280" y="86" width="200" height="38" rx="8" class="arq-dom"/>
  <text x="380" y="101" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">TableroContent</text>
  <text x="380" y="117" class="arq-t arq-xs" text-anchor="middle">recibe otro TableroUiState</text>
  <line x1="380" y1="54" x2="380" y2="84" class="arq-guide"/>
  <rect x="110" y="156" width="190" height="38" rx="8" class="arq-gray arq-dashed"/>
  <text x="205" y="171" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">Marcador</text>
  <text x="205" y="187" class="arq-t arq-xs" text-anchor="middle">movimientos: 0 → 0</text>
  <rect x="470" y="156" width="210" height="38" rx="8" class="arq-dom"/>
  <text x="575" y="171" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">LazyVerticalGrid</text>
  <text x="575" y="187" class="arq-t arq-xs" text-anchor="middle">recorre estado.cartas</text>
  <line x1="380" y1="124" x2="205" y2="154" class="arq-guide"/>
  <line x1="380" y1="124" x2="575" y2="154" class="arq-guide"/>

  <rect x="40" y="236" width="100" height="40" rx="8" class="arq-gray arq-dashed"/>
  <text x="90" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 1</text>
  <text x="90" y="268" class="arq-t arq-xs" text-anchor="middle">?</text>
  <rect x="160" y="236" width="100" height="40" rx="8" class="arq-gray arq-dashed"/>
  <text x="210" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 2</text>
  <text x="210" y="268" class="arq-t arq-xs" text-anchor="middle">?</text>
  <rect x="280" y="236" width="100" height="40" rx="8" class="arq-dom"/>
  <text x="330" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 3</text>
  <text x="330" y="268" class="arq-t arq-xs" text-anchor="middle">? → ⭐</text>
  <rect x="400" y="236" width="100" height="40" rx="8" class="arq-gray arq-dashed"/>
  <text x="450" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 4</text>
  <text x="450" y="268" class="arq-t arq-xs" text-anchor="middle">?</text>
  <rect x="520" y="236" width="100" height="40" rx="8" class="arq-gray arq-dashed"/>
  <text x="570" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 5</text>
  <text x="570" y="268" class="arq-t arq-xs" text-anchor="middle">?</text>
  <rect x="640" y="236" width="100" height="40" rx="8" class="arq-gray arq-dashed"/>
  <text x="690" y="252" class="arq-t arq-code arq-xs arq-strong" text-anchor="middle">CartaView 6</text>
  <text x="690" y="268" class="arq-t arq-xs" text-anchor="middle">?</text>
  <line x1="575" y1="194" x2="90" y2="234" class="arq-guide"/>
  <line x1="575" y1="194" x2="210" y2="234" class="arq-guide"/>
  <line x1="575" y1="194" x2="330" y2="234" class="arq-guide"/>
  <line x1="575" y1="194" x2="450" y2="234" class="arq-guide"/>
  <line x1="575" y1="194" x2="570" y2="234" class="arq-guide"/>
  <line x1="575" y1="194" x2="690" y2="234" class="arq-guide"/>

  <text x="40" y="40" class="arq-t arq-xs arq-strong">👆 pulsas la carta 3</text>
  <text x="40" y="56" class="arq-t arq-xs arq-muted">llega un estado nuevo</text>

  <rect x="40" y="298" width="24" height="16" rx="4" class="arq-dom"/>
  <text x="72" y="311" class="arq-t arq-xs">se vuelve a ejecutar</text>
  <rect x="250" y="298" width="24" height="16" rx="4" class="arq-gray arq-dashed"/>
  <text x="282" y="311" class="arq-t arq-xs">Compose se la salta: sus datos no han cambiado</text>
  <text x="380" y="334" class="arq-t arq-s arq-strong" text-anchor="middle">Solo se recompone quien lee lo que ha cambiado.</text>
</svg>
