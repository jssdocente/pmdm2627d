name: build-push-mkdocs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos necesarios para el despliegue nativo en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue simultáneo para evitar condiciones de carrera
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Instalar dependencias MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-glightbox

      - name: Compilar sitio con MkDocs
        run: |
          mkdocs build

      # Apuntes para consultar sin conexión: se genera aparte (plugins offline
      # y privacy, sin _bck/ ni profesor/) y se publica como un zip dentro del
      # propio sitio: https://jssdocente.github.io/pmdm2627d/pmdm2627-apuntes-offline.zip
      - name: Generar zip de los apuntes sin conexión
        env:
          OFFLINE: "true"
        run: |
          mkdocs build -f mkdocs-offline.yml
          cd site-offline
          zip -rq9 ../site/pmdm2627-apuntes-offline.zip pmdm2627-apuntes -x '*/search/search_index.json'
          ls -lh ../site/pmdm2627-apuntes-offline.zip

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
